      var center = new THREE.Vector3(); box.getCenter(center);
      var pos = spawnPosition();
      root.position.x = pos.x - center.x;
      root.position.z = pos.z - center.z;
      root.position.y -= box.min.y;

      root.traverse(function(o){
        if(o.isMesh){
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      root.userData.selectable = true;
      root.userData.kind = 'shape';
      root.userData.label = file.name.replace(/\.(glb|gltf)$/i,'');
      root.userData.imported = true;
      updateReflectionProbe(root);

      pushHistory();
      scene.add(root);
      objects.push(root);
      placedCount++;
      select(root);
      updateHud();
      URL.revokeObjectURL(url);
      showToast('Imported ' + root.userData.label);
    }, undefined, function(err){
      console.error(err);
      showToast('Could not load that file — make sure it’s a valid glTF/GLB model.');
      URL.revokeObjectURL(url);
    });
    fileInput.value = '';
  });

  // ---------------------------------------------------------------
  // Selection
  // ---------------------------------------------------------------
  var raycaster = new THREE.Raycaster();
  var pointerNdc = new THREE.Vector2();
  var selected = null;
  var pointerDown = null;
  var wasDragging = false;

  // Multi-select: shift/ctrl (or cmd) -click a second shape or light to add
  // it to multiSelected. Once it holds 2+ items, `selected` goes back to
  // null (no single-object inspector) and the gizmo attaches to a small
  // invisible pivot parked at the group's centroid instead -- dragging it
  // moves every selected object together by the same delta. Falls back to
  // ordinary single-select automatically the moment the group shrinks to
  // 0 or 1 members.
  var multiSelected = [];
  var multiPivot = new THREE.Object3D();
  scene.add(multiPivot);
  var multiPivotLastPos = new THREE.Vector3();
  var multiCentroidTmp = new THREE.Vector3();

  function multiCentroid(target){
    target.set(0, 0, 0);
    if(!multiSelected.length) return target;
    multiSelected.forEach(function(o){ target.add(o.getWorldPosition(multiCentroidTmp.clone())); });
    target.multiplyScalar(1 / multiSelected.length);
    return target;
  }
  function updateMultiPivot(){
    multiCentroid(multiPivot.position);
    multiPivotLastPos.copy(multiPivot.position);
    xform.setMode('translate');
    Object.keys(modeButtons).forEach(function(k){ modeButtons[k].classList.toggle('active', k === 'translate'); });
    xform.attach(multiPivot);
  }
  function clearMultiSelect(){
    if(!multiSelected.length) return;
    multiSelected = [];
  }
  function toggleMultiSelect(root){
    if(multiSelected.length === 0 && selected){
      multiSelected = [selected];
      selected = null;
    }
    var idx = multiSelected.indexOf(root);
    if(idx >= 0) multiSelected.splice(idx, 1);
    else multiSelected.push(root);

    if(multiSelected.length <= 1){
      var only = multiSelected[0] || null;
      multiSelected = [];
      if(only) select(only); else deselect();
      return;
    }
    xform.detach();
    updateMultiPivot();
    renderInspector();
    updateOutlinerSelection();
  }
  function deleteMultiSelected(){
    var group = multiSelected.slice();
    multiSelected = [];
    xform.detach();
    pushHistory();
    group.forEach(function(o){
      if(o.userData.kind === 'light') removeLight(o, true); else removeObject(o, true);
    });
    deselect();
  }
  function duplicateMultiSelected(){
    var group = multiSelected.slice();
    if(!group.length) return;
    pushHistory();
    var clones = group.map(function(o){ return duplicateOne(o, true); }).filter(Boolean);
    xform.detach();
    if(clones.length > 1){
      multiSelected = clones;
      selected = null;
      updateMultiPivot();
      renderInspector();
      updateOutlinerSelection();
      updateHud();
    } else if(clones.length === 1){
      multiSelected = [];
      select(clones[0]);
      updateHud();
    }
  }

  function findSelectableRoot(obj){
    var o = obj;
    while(o){
      if(o.userData && o.userData.selectable) return o;
      o = o.parent;
    }
    return null;
  }

  function raycastTargets(){
    return objects.concat(lights);
  }

  canvas.addEventListener('pointerdown', function(e){
    pointerDown = { x: e.clientX, y: e.clientY, multi: e.shiftKey || e.ctrlKey || e.metaKey };
  });

  canvas.addEventListener('pointerup', function(e){
    if(xform.dragging){ wasDragging = true; return; }
    if(wasDragging){ wasDragging = false; return; }
    if(!pointerDown) return;
    var dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
    var isMulti = pointerDown.multi;
    pointerDown = null;
    if(Math.sqrt(dx*dx + dy*dy) > 5) return; // was a drag/orbit, not a click

    var rect = canvas.getBoundingClientRect();
    pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    var hits = raycaster.intersectObjects(raycastTargets(), true);
    var root = hits.length ? findSelectableRoot(hits[0].object) : null;

    if(isMulti){
      if(root) toggleMultiSelect(root);
      return;
    }
    if(root) select(root); else deselect();
  });

  function select(obj){
    multiSelected = [];
    selected = obj;
    xform.attach(obj);
    renderInspector();
    // A full renderOutliner() rebuild here (rather than just updating which
    // row shows as selected) used to break double-click-to-rename: the
    // very first click of a double-click already runs through here and
    // tears down/recreates every row, so the second click of the pair
    // lands on a brand-new element instead of the one the browser started
    // tracking -- which means no dblclick event fires at all (Chromium
    // requires the same element for both clicks). Selection alone never
    // changes which items exist, so it only needs the lighter update.
    updateOutlinerSelection();
  }
  function deselect(){
    multiSelected = [];
    selected = null;
    xform.detach();
    renderInspector();
    updateOutlinerSelection();
  }

  // ---------------------------------------------------------------
  // Transform mode
  // ---------------------------------------------------------------
  var modeButtons = {
    translate: document.getElementById('modeMove'),
    rotate: document.getElementById('modeRotate'),
    scale: document.getElementById('modeScale')
  };
  function setMode(mode){
    if(mode !== 'translate' && multiSelected.length > 1) return;
    xform.setMode(mode);
    Object.keys(modeButtons).forEach(function(k){
      modeButtons[k].classList.toggle('active', k === mode);
    });
  }
  modeButtons.translate.addEventListener('click', function(){ setMode('translate'); });
  modeButtons.rotate.addEventListener('click', function(){ setMode('rotate'); });
  modeButtons.scale.addEventListener('click', function(){ setMode('scale'); });
  setMode('translate');

  document.getElementById('clearBtn').addEventListener('click', function(){
    if(!objects.length) return;
    pushHistory();
    objects.slice().forEach(function(o){ removeObject(o, true); });
  });

  function removeObject(obj, skipHistory){
    if(!skipHistory) pushHistory();
    if(selected === obj) deselect();
    var mi = multiSelected.indexOf(obj);
    if(mi >= 0) multiSelected.splice(mi, 1);
    disposeOwnProbe(obj);
    removeGlowLight(obj);
    removeAllBlobShadows(obj);
    scene.remove(obj);
    eachMaterial(obj, function(m){ m.dispose(); });
    obj.traverse(function(o){
      if(o.isMesh && o.geometry) o.geometry.dispose();
    });
    var idx = objects.indexOf(obj);
    if(idx >= 0) objects.splice(idx, 1);
    updateHud();
  }

  // ---------------------------------------------------------------
  // Duplicate (Ctrl+D / toolbar button)
  // ---------------------------------------------------------------
  var DUPLICATE_OFFSET = 0.6;

  // An imported glTF's meshes can share material instances with each other
  // (e.g. several parts of one model using the same material). A plain
  // Object3D.clone(true) copies the hierarchy but keeps those material
  // (and, harmlessly, geometry) references shared with the original, so
  // editing the duplicate's color/roughness/etc. would also change the
  // source model. This walks the clone and swaps in a cloned material for
  // every unique one found, preserving any sharing *within* the clone
  // while fully decoupling it from the original.
  function cloneMaterialsIndependently(root){
    var seen = [];
    var clones = [];
    function cloneOf(m){
      var idx = seen.indexOf(m);
      if(idx === -1){
        seen.push(m);
        clones.push(m.clone());
        idx = seen.length - 1;
      }
      return clones[idx];
    }
    root.traverse(function(o){
      if(!o.isMesh || !o.material) return;
      o.material = Array.isArray(o.material) ? o.material.map(cloneOf) : cloneOf(o.material);
    });
  }

  // The actual duplicate logic for one object, factored out so both the
  // single-selection path (Ctrl+D / the inspector's duplicate button) and
  // the multi-select "duplicate all" path can share it. skipHistory is true
  // when the caller is about to duplicate several objects as one undo step
  // and has already pushed its own snapshot.
  function duplicateOne(obj, skipHistory){
    if(!skipHistory) pushHistory();

    if(obj.userData.kind === 'light'){
      var type = obj.userData.lightType;
      var lo = obj.userData.lightObj;
      var pos = obj.position.clone().add(new THREE.Vector3(DUPLICATE_OFFSET, 0, DUPLICATE_OFFSET));
      return addLight(type, pos, lo.color.getHex(), lo.intensity);
    }

    if(obj.userData.imported){
      var clone = obj.clone(true);
      cloneMaterialsIndependently(clone);
      clone.position.copy(obj.position).add(new THREE.Vector3(DUPLICATE_OFFSET, 0, DUPLICATE_OFFSET));
      clone.quaternion.copy(obj.quaternion);
      clone.scale.copy(obj.scale);
      clone.userData.selectable = true;
      clone.userData.kind = 'shape';
      clone.userData.imported = true;
      clone.userData.label = (obj.userData.label || 'Model') + ' copy';
      clone.userData.preset = obj.userData.preset;
      clone.userData.color = obj.userData.color;
      clone.userData.ownProbe = null;
      clone.userData.glowLight = null;
      clone.userData.blobShadows = null;
      clone.traverse(function(o){ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
      updateReflectionProbe(clone);
      scene.add(clone);
      objects.push(clone);
      placedCount++;
      return clone;
    }

    // Basic primitive: rebuilt fresh (same as Save/Load does) so the copy
    // gets its own independent material rather than sharing the original's.
    var built = createPrimitive(obj.userData.shapeType);
    if(!built) return null;
    var mesh = built.mesh;
    mesh.position.copy(obj.position).add(new THREE.Vector3(DUPLICATE_OFFSET, 0, DUPLICATE_OFFSET));
    mesh.quaternion.copy(obj.quaternion);
    mesh.scale.copy(obj.scale);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.selectable = true;
    mesh.userData.kind = 'shape';
    mesh.userData.label = (obj.userData.label || built.label) + ' copy';
    var srcMat = firstMaterial(obj);
    applyPreset(mesh, obj.userData.preset || 'matte');
    applyColor(mesh, obj.userData.color || nextSpawnColor());
    if(srcMat){
      applyRoughness(mesh, srcMat.roughness);
      applyMetalness(mesh, srcMat.metalness);
      applyOpacity(mesh, srcMat.opacity);
      if(srcMat.emissive) applyEmissiveColor(mesh, '#' + srcMat.emissive.getHexString());
      if('emissiveIntensity' in srcMat) applyEmissiveIntensity(mesh, srcMat.emissiveIntensity);
      if('clearcoat' in srcMat) applyClearcoat(mesh, srcMat.clearcoat);
    }
    if(obj.userData.textureDataUrl) applyTexture(mesh, obj.userData.textureDataUrl, obj.userData.textureName);
    updateReflectionProbe(mesh);
    scene.add(mesh);
    objects.push(mesh);
    placedCount++;
    return mesh;
  }

  function duplicateSelected(){
    if(multiSelected.length > 1){ duplicateMultiSelected(); return; }
    if(!selected) return;
    var result = duplicateOne(selected, false);
    if(!result){ undoStack.pop(); return; }
    select(result);
    updateHud();
  }

  // ---------------------------------------------------------------
  // Undo / redo history
  // ---------------------------------------------------------------
  var undoStack = [];
  var redoStack = [];
  var HISTORY_LIMIT = 60;
  var historyChanging = false;
  var historyPending = null;

  function captureSnapshot(){
    return {
      objects: objects.map(function(o){
        var m = firstMaterial(o);
        return {
          ref: o,
          pos: o.position.clone(),
          quat: o.quaternion.clone(),
          scale: o.scale.clone(),
          preset: o.userData.preset,
          color: o.userData.color,
          roughness: m ? m.roughness : undefined,
          metalness: m ? m.metalness : undefined,
          opacity: m ? m.opacity : undefined,
          emissive: m && m.emissive ? '#' + m.emissive.getHexString() : undefined,
          emissiveIntensity: m ? m.emissiveIntensity : undefined,
          clearcoat: m && ('clearcoat' in m) ? m.clearcoat : undefined,
          textureDataUrl: o.userData.textureDataUrl || null,
          textureName: o.userData.textureName || null
        };
      }),
      lights: lights.map(function(l){
        var lo = l.userData.lightObj;
        return {
          ref: l,
          pos: l.position.clone(),
          color: lo.color.getHex(),
          intensity: lo.intensity
        };
      }),
      groundColor: sceneState.groundColor,
      groundTexture: sceneState.groundTexture,
      background: {
        mode: sceneState.bgMode,
        preset: sceneState.bgPreset,
        solidColor: sceneState.bgSolidColor,
        imageDataUrl: sceneState.bgImageDataUrl,
        imageName: sceneState.bgImageName
      }
    };
  }

  function restoreSnapshot(snap){
    // Undo/redo always restores to a plain single (or no) selection --
    // a stale multi-select referencing objects that may no longer exist
    // (or exist with a different identity, for redo-recreated ones) isn't
    // meaningful to carry across a history jump.
    multiSelected = [];
    objects.slice().forEach(function(o){
      var stillThere = snap.objects.some(function(s){ return s.ref === o; });
      if(!stillThere){
        if(selected === o) selected = null;
        scene.remove(o);
        // The blob shadow decals live as their own sibling scene objects
        // (so they can stay flat on the ground regardless of the object's
        // own rotation), not children of o — scene.remove(o) above
        // doesn't touch them, so they have to be cleaned up explicitly
        // here. They get recreated for free by applyOpacity() below
        // if/when redo brings this object back.
        removeAllBlobShadows(o);
      }
    });
    objects.length = 0;
    snap.objects.forEach(function(s){
      if(s.ref.parent !== scene) scene.add(s.ref);
      s.ref.position.copy(s.pos);
      s.ref.quaternion.copy(s.quat);
      s.ref.scale.copy(s.scale);
      if(s.preset) applyPreset(s.ref, s.preset);
      if(s.color) applyColor(s.ref, s.color);
      if(typeof s.roughness === 'number') applyRoughness(s.ref, s.roughness);
      if(typeof s.metalness === 'number') applyMetalness(s.ref, s.metalness);
      if(typeof s.opacity === 'number') applyOpacity(s.ref, s.opacity);
      if(s.emissive) applyEmissiveColor(s.ref, s.emissive);
      if(typeof s.emissiveIntensity === 'number') applyEmissiveIntensity(s.ref, s.emissiveIntensity);
      if(typeof s.clearcoat === 'number') applyClearcoat(s.ref, s.clearcoat);
      // Only touch the texture when it actually changed -- TextureLoader.load
      // is async, so re-triggering it every undo/redo step (even back to the
      // same image) would be wasteful and could flicker.
      if(s.textureDataUrl){
        if(s.ref.userData.textureDataUrl !== s.textureDataUrl) applyTexture(s.ref, s.textureDataUrl, s.textureName);
      } else if(s.ref.userData.textureDataUrl){
        clearTexture(s.ref);
      }
      updateReflectionProbe(s.ref);
      objects.push(s.ref);
    });

    lights.slice().forEach(function(l){
      var stillThere = snap.lights.some(function(s){ return s.ref === l; });
      if(!stillThere){
        if(selected === l) selected = null;
        scene.remove(l);
        scene.remove(l.userData.lightObj);
        if(l.userData.lightType === 'sun') scene.remove(l.userData.lightObj.target);
      }
    });
    lights.length = 0;
    snap.lights.forEach(function(s){
      if(s.ref.parent !== scene){
        scene.add(s.ref);
        scene.add(s.ref.userData.lightObj);
        if(s.ref.userData.lightType === 'sun') scene.add(s.ref.userData.lightObj.target);
      }
      s.ref.position.copy(s.pos);
      syncLightTransform(s.ref);
      s.ref.userData.lightObj.color.setHex(s.color);
      s.ref.userData.lightObj.intensity = s.intensity;
      s.ref.userData.core.material.color.setHex(s.color);
      s.ref.userData.glow.material.color.setHex(s.color);
      lights.push(s.ref);
    });

    setGroundColor(snap.groundColor);
    setGroundTexture(snap.groundTexture);
    restoreBackground(snap.background);

    if(selected && objects.indexOf(selected) === -1 && lights.indexOf(selected) === -1) selected = null;
    if(selected) xform.attach(selected); else xform.detach();
    renderInspector();
    renderOutliner();
    updateHud();
  }

  function pushHistory(){
    undoStack.push(captureSnapshot());
    if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack.length = 0;
    updateHistoryButtons();
  }

  function beginChange(){
    if(historyChanging) return;
    historyChanging = true;
    historyPending = captureSnapshot();
  }
  function commitChange(){
    if(!historyChanging) return;
    historyChanging = false;
    undoStack.push(historyPending);
    if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack.length = 0;
    historyPending = null;
    updateHistoryButtons();
  }

  function undo(){
    if(!undoStack.length) return;
    var snap = undoStack.pop();
    redoStack.push(captureSnapshot());
    restoreSnapshot(snap);
    updateHistoryButtons();
  }
  function redo(){
    if(!redoStack.length) return;
    var snap = redoStack.pop();
    undoStack.push(captureSnapshot());
    restoreSnapshot(snap);
    updateHistoryButtons();
  }

  var undoBtn = document.getElementById('undoBtn');
  var redoBtn = document.getElementById('redoBtn');
  function updateHistoryButtons(){
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  function wireContinuous(el, onChange){
    el.addEventListener('input', function(e){
      beginChange();
      onChange(e);
    });
    el.addEventListener('change', function(e){
      onChange(e);
      commitChange();
    });
  }

  // ---------------------------------------------------------------
  // Save / Load (manual, browser local storage)
  // ---------------------------------------------------------------
  var STORAGE_KEY = 'lightbox-studio-scene-v1';

  function serializeScene(){
    var prims = [];
    var skipped = 0;
    objects.forEach(function(o){
      if(o.userData.imported){ skipped++; return; }
      var m = firstMaterial(o);
      prims.push({
        shapeType: o.userData.shapeType,
        label: o.userData.label,
        position: o.position.toArray(),
        quaternion: o.quaternion.toArray(),
        scale: o.scale.toArray(),
        preset: o.userData.preset,
        color: o.userData.color,
        roughness: m ? m.roughness : undefined,
        metalness: m ? m.metalness : undefined,
        opacity: m ? m.opacity : undefined,
        emissive: m && m.emissive ? '#' + m.emissive.getHexString() : undefined,
        emissiveIntensity: m ? m.emissiveIntensity : undefined,
        clearcoat: m && ('clearcoat' in m) ? m.clearcoat : undefined,
        textureDataUrl: o.userData.textureDataUrl || null,
        textureName: o.userData.textureName || null
      });
    });
    var lightsOut = lights.map(function(l){
      var lo = l.userData.lightObj;
      return {
        type: l.userData.lightType,
        position: l.position.toArray(),
        color: lo.color.getHex(),
        intensity: lo.intensity
      };
    });
    return {
      version: 2,
      objects: prims,
      skippedImports: skipped,
      placedCount: placedCount,
      lights: lightsOut,
      ground: { color: sceneState.groundColor, texture: sceneState.groundTexture },
      background: {
        mode: sceneState.bgMode,
        preset: sceneState.bgPreset,
        solidColor: sceneState.bgSolidColor,
        imageDataUrl: sceneState.bgImageDataUrl,
        imageName: sceneState.bgImageName
      },
      shadowSoftness: sceneState.shadowSoftness,
      bloom: {
        enabled: sceneState.bloomEnabled,
        strength: sceneState.bloomStrength,
        radius: sceneState.bloomRadius,
        threshold: sceneState.bloomThreshold
      }
    };
  }

  function saveScene(){
    var data = serializeScene();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      var note = data.skippedImports ? (' (' + data.skippedImports + ' imported model' + (data.skippedImports > 1 ? 's' : '') + ' not included — only basic shapes are saved for now)') : '';
      showToast('Scene saved' + note + '.');
    } catch(err){
      console.error(err);
      showToast('Could not save — your browser blocked local storage.');
    }
  }

  // Shared by "Load saved scene" (localStorage), "Import scene from file",
  // and the starter templates -- all three just hand a scene-shaped data
  // object to this and it does the actual rebuilding. successLabel is the
  // lead-in for the toast ("Scene loaded", "Scene imported", the template's
  // own name, etc).
  function applySceneData(data, successLabel){
    pushHistory();

    objects.slice().forEach(function(o){ removeObject(o, true); });
    lights.slice().forEach(function(l){ removeLight(l, true); });

    (data.objects || []).forEach(function(s){
      if(!SHAPE_DEFS[s.shapeType]) return;
      var built = createPrimitive(s.shapeType);
      var mesh = built.mesh;
      mesh.position.fromArray(s.position || [0, built.halfHeight, 0]);
      mesh.quaternion.fromArray(s.quaternion || [0,0,0,1]);
      mesh.scale.fromArray(s.scale || [1,1,1]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.selectable = true;
      mesh.userData.kind = 'shape';
      mesh.userData.label = s.label || built.label;
      applyPreset(mesh, s.preset || 'matte');
      applyColor(mesh, s.color || nextSpawnColor());
      if(typeof s.roughness === 'number') applyRoughness(mesh, s.roughness);
      if(typeof s.metalness === 'number') applyMetalness(mesh, s.metalness);
      if(typeof s.opacity === 'number') applyOpacity(mesh, s.opacity);
      if(s.emissive) applyEmissiveColor(mesh, s.emissive);
      if(typeof s.emissiveIntensity === 'number') applyEmissiveIntensity(mesh, s.emissiveIntensity);
      if(typeof s.clearcoat === 'number') applyClearcoat(mesh, s.clearcoat);
      if(s.textureDataUrl) applyTexture(mesh, s.textureDataUrl, s.textureName);
      updateReflectionProbe(mesh);
      scene.add(mesh);
      objects.push(mesh);
    });

    // "lights" is the current format (an array, any mix of point/sun);
    // "light" (singular) is what Phase 1 saves used — a single point
    // light — kept working here so those older saves still load.
    var lightsData = data.lights;
    if(!lightsData && data.light){
      lightsData = [{ type: 'point', position: data.light.position, color: data.light.color, intensity: data.light.intensity }];
    }
    (lightsData || []).forEach(function(s){
      if(!LIGHT_TYPES[s.type]) return;
      var pos = s.position ? new THREE.Vector3(s.position[0], s.position[1], s.position[2]) : null;
      addLight(s.type, pos, s.color, s.intensity);
    });
    if(!lights.length){
      // Never load into total darkness even if a save somehow had no lights.
      addLight('point', new THREE.Vector3(DEFAULT_LIGHT_POS[0], DEFAULT_LIGHT_POS[1], DEFAULT_LIGHT_POS[2]), DEFAULT_LIGHT_COLOR, DEFAULT_LIGHT_INTENSITY);
    }

    if(data.ground){
      setGroundColor(data.ground.color);
      var groundTexKey = data.ground.texture;
      if(!groundTexKey) groundTexKey = (data.ground.checker === false) ? 'plain' : 'checker';
      setGroundTexture(groundTexKey);
    }
    if(data.background && typeof data.background === 'object'){
      restoreBackground(data.background);
    } else {
      // Older saves stored just the preset key as a plain string.
      setBackgroundPreset(data.background);
    }
    applyShadowSoftness(typeof data.shadowSoftness === 'number' ? data.shadowSoftness : 1);
    if(data.bloom && typeof data.bloom === 'object'){
      sceneState.bloomEnabled = !!data.bloom.enabled;
      sceneState.bloomStrength = typeof data.bloom.strength === 'number' ? data.bloom.strength : sceneState.bloomStrength;
      sceneState.bloomRadius = typeof data.bloom.radius === 'number' ? data.bloom.radius : sceneState.bloomRadius;
      sceneState.bloomThreshold = typeof data.bloom.threshold === 'number' ? data.bloom.threshold : sceneState.bloomThreshold;
      applyBloomSettings();
    }

    placedCount = typeof data.placedCount === 'number' ? data.placedCount : objects.length;
    deselect();
    updateHud();

    var note = data.skippedImports ? (' (' + data.skippedImports + ' imported model' + (data.skippedImports > 1 ? 's' : '') + ' from that save couldn’t be restored)') : '';

  // Offering a file works two different ways depending on where this page
  // is running. Opened directly (the usual way -- a plain HTML file synced
  // to disk), a plain <a download> anchor is a real, working browser
  // download. Viewed through the hosted Claude Artifact preview, that
  // iframe never grants a page direct download access -- the anchor click
  // silently does nothing there -- so the page instead offers the file
  // through the `downloads` capability when the sandbox provides one
  // (window.claude.use('downloads')), and only falls back to the anchor
  // when it doesn't. Same file, whichever path actually works here.
  var downloadsCapability = null;
  var downloadsCapabilityChecked = false;
  function getDownloadsCapability(cb){
    if(typeof claude === 'undefined' || !claude || typeof claude.use !== 'function'){ cb(null); return; }
    if(downloadsCapabilityChecked){ cb(downloadsCapability); return; }
    claude.use('downloads').then(function(d){
      downloadsCapabilityChecked = true;
      downloadsCapability = d;
      cb(d);
    }).catch(function(){
      downloadsCapabilityChecked = true;
      downloadsCapability = null;
      cb(null);
    });
  }
  function anchorDownload(filename, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function saveFile(filename, blob, onSaved){
    getDownloadsCapability(function(d){
      if(!d){ anchorDownload(filename, blob); if(onSaved) onSaved(); return; }
      d.save({ filename: filename, data: blob }).then(function(){
        if(onSaved) onSaved();
      }).catch(function(err){
        if(err && err.code === 'declined') return; // the viewer said no -- respect it, no fallback
        anchorDownload(filename, blob);
        if(onSaved) onSaved();
      });
    });
  }

      applySceneData(data, 'Scene imported');
    };
    reader.onerror = function(){ showToast('Could not read that file.'); };
    reader.readAsText(file);
  }

  // ---------------------------------------------------------------
  // Export for Ray Tracer (Phase 3)
  //
  // Produces a scene.json the companion C++ ray tracer can load
  // directly (see src/main.cpp's render_from_scene_file). One-way,
  // sandbox -> final render: this is an export, not a save format --
  // loading it back into Lightbox Studio isn't supported.
  //
  // Spheres with uniform scale export as native spheres (exact, cheap).
  // Everything else -- box/cylinder primitives (which can be rotated
  // arbitrarily) and imported glTF models -- gets triangulated here in
  // the browser, where three.js already has the exact world-space
  // geometry, rather than writing separate box/cylinder intersection
  // code in C++. Sun/Point lights and glowing objects become emissive
  // ("diffuse_light") spheres, since the tracer has no other concept of
  // a discrete light source.
  // ---------------------------------------------------------------
  var RT_GLOW_EXPORT_SCALE = 3.0;
  var RT_POINT_LIGHT_EXPORT_SCALE = 0.6;
  var RT_SUN_EXPORT_SCALE = 1.1;
  var RT_SUN_DISTANCE = 200;
  var RT_SUN_RADIUS = 30;

  function rtRound(n){ return Math.round(n * 1000) / 1000; }

  function rtIsUniformScale(v, eps){
    eps = eps || 0.01;
    return Math.abs(v.x - v.y) < eps && Math.abs(v.y - v.z) < eps;
  }

  // Walks every mesh under root, applies each one's world matrix, and
  // flattens the result to a plain list of world-space triangles —
  // works the same way whether root is a single-mesh primitive (box,
  // cylinder) or a multi-mesh imported glTF scene graph.
  function rtMeshToTriangles(root){
    var tris = [];
    root.updateWorldMatrix(true, false);
    var v = new THREE.Vector3();
    root.traverse(function(o){
      if(!o.isMesh || !o.geometry) return;
      var geom = o.geometry;
      var posAttr = geom.attributes && geom.attributes.position;
      if(!posAttr) return;
      var idx = geom.index;
      var m = o.matrixWorld;

      function vertexAt(i){
        v.fromBufferAttribute(posAttr, i);
        v.applyMatrix4(m);
        return [rtRound(v.x), rtRound(v.y), rtRound(v.z)];
      }

      if(idx){
        for(var i = 0; i + 2 < idx.count; i += 3){
          tris.push([vertexAt(idx.getX(i)), vertexAt(idx.getX(i + 1)), vertexAt(idx.getX(i + 2))]);
        }
      } else {
        for(var i = 0; i + 2 < posAttr.count; i += 3){
          tris.push([vertexAt(i), vertexAt(i + 1), vertexAt(i + 2)]);
        }
      }
    });
    return tris;
  }

  // Draws a texture's image down to a small canvas and averages the
  // pixels to get one representative color -- used as a stand-in for
  // imported models whose real look comes from a texture map rather
  // than a flat material color. Returns null (falls back to white)
  // if the image can't be read for any reason (untainted-canvas edge
  // cases, a texture with no image yet, etc.).
  function rtSampleTextureColor(tex){
    try{
      var img = tex && tex.image;
      var w = img && (img.width || img.videoWidth);
      var h = img && (img.height || img.videoHeight);
      if(!w || !h) return null;
      var size = 16;
      var c = document.createElement('canvas');
      c.width = c.height = size;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, size, size);
      var data = ctx.getImageData(0, 0, size, size).data;
      var r = 0, g = 0, b = 0, n = 0;
      for(var i = 0; i < data.length; i += 4){
        if(data[i + 3] < 8) continue; // skip transparent texels
        r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
      }
      if(!n) return null;
      return new THREE.Color(r / n / 255, g / n / 255, b / n / 255);
    } catch(err){
      return null; // tainted/unreadable canvas -- caller falls back
    }
  }

  function rtAverageImportedColor(root){
    var sum = new THREE.Color(0, 0, 0);
    var count = 0;
    eachMaterial(root, function(m){
      var c = m.map ? rtSampleTextureColor(m.map) : null;
      if(!c && m.color) c = m.color;
      if(c){ sum.r += c.r; sum.g += c.g; sum.b += c.b; count++; }
    });
    if(!count) return null;
    return new THREE.Color(sum.r / count, sum.g / count, sum.b / count);
  }

  function rtMaterialForObject(o){
    var m = firstMaterial(o);
    if(!m) return { type: 'lambertian', albedo: [0.7, 0.7, 0.7] };

    var emissiveIntensity = m.emissiveIntensity || 0;
    if(emissiveIntensity > 0.001 && m.emissive && (m.emissive.r || m.emissive.g || m.emissive.b)){
      // Glowing objects export as pure light (no reflective base color),
      // matching the Ray Tracing in One Weekend/Next Week convention
      // for emissive materials that the tracer's diffuse_light follows.
      var e = m.emissive.clone().multiplyScalar(emissiveIntensity * RT_GLOW_EXPORT_SCALE);
      return { type: 'diffuse_light', emit: [rtRound(e.r), rtRound(e.g), rtRound(e.b)] };
    }

    var col;
    if(o.userData.color){
      col = new THREE.Color(o.userData.color);
    } else if(o.userData.imported){
      // Imported glTF models keep their own per-mesh materials, and most
      // of the time their "color" is white because the look actually
      // comes from a texture map, not a flat color factor. Sample each
      // textured material's average color instead of defaulting to
      // white, so an imported model at least exports its rough hue.
      col = rtAverageImportedColor(o) || new THREE.Color(m.color ? '#' + m.color.getHexString() : '#ffffff');
    } else {
      col = new THREE.Color(m.color ? '#' + m.color.getHexString() : '#ffffff');
    }

    if(typeof m.opacity === 'number' && m.opacity < 0.999){
      return { type: 'dielectric', ior: 1.5 };
    }
    if(typeof m.metalness === 'number' && m.metalness >= 0.5){
      var fuzz = typeof m.roughness === 'number' ? Math.min(m.roughness, 1) : 0.1;
      return { type: 'metal', albedo: [rtRound(col.r), rtRound(col.g), rtRound(col.b)], fuzz: rtRound(fuzz) };
    }
    return { type: 'lambertian', albedo: [rtRound(col.r), rtRound(col.g), rtRound(col.b)] };
  }

  function rtExportObjects(){
    var out = [];
    var worldPos = new THREE.Vector3();
    objects.forEach(function(o){
      var mat = rtMaterialForObject(o);
      if(o.userData.shapeType === 'sphere' && !o.userData.imported && rtIsUniformScale(o.scale)){
        o.getWorldPosition(worldPos);
        var radius = 0.6 * o.scale.x; // SHAPE_DEFS.sphere's base geometry radius is 0.6
        out.push({
          type: 'sphere',
          center: [rtRound(worldPos.x), rtRound(worldPos.y), rtRound(worldPos.z)],
          radius: rtRound(radius),
          material: mat
        });
        return;
      }
      var tris = rtMeshToTriangles(o);
      if(tris.length){
        out.push({ type: 'mesh', material: mat, triangles: tris });
      }
    });
    return out;
  }

  function rtExportGround(){
    var tint = new THREE.Color(sceneState.groundColor || '#ffffff');
    var texKey = sceneState.groundTexture || 'checker';
    var col;
    if(texKey === 'plain'){
      // "Plain" has no texture at all in the live scene -- the tint IS
      // the ground color, so export it as-is.
      col = tint;
    } else {
      // Every other ground preset (Checker/Dirt/Grass/Cement) is a
      // procedural texture that isn't carried over -- solid color only.
      // Multiply the tint by that preset's representative flat color
      // (the same swatch shown in its picker button), the same way the
      // tint multiplies the live texture on screen, so a preset like
      // Grass still exports roughly the right hue instead of washing
      // out to the tint alone (white, by default).
      var swatchHex = (GROUND_TEXTURES[texKey] && GROUND_TEXTURES[texKey].swatch) || '#ffffff';
      var swatch = new THREE.Color(swatchHex);
      col = new THREE.Color(tint.r * swatch.r, tint.g * swatch.g, tint.b * swatch.b);
    }
    // The classic Ray Tracing in One Weekend trick: a giant sphere reads
    // as a flat ground plane near the origin.
    return {
      type: 'sphere',
      center: [0, -1000, 0],
      radius: 1000,
      material: { type: 'lambertian', albedo: [rtRound(col.r), rtRound(col.g), rtRound(col.b)] }
    };
  }

  function rtExportLights(){
    var out = [];
    lights.forEach(function(l){
      var lo = l.userData.lightObj;
      var col = new THREE.Color(lo.color.getHex());
      if(l.userData.lightType === 'point'){
        var e = col.clone().multiplyScalar(lo.intensity * RT_POINT_LIGHT_EXPORT_SCALE);
        out.push({
          type: 'sphere',
          center: [rtRound(l.position.x), rtRound(l.position.y), rtRound(l.position.z)],
          radius: 0.15,
          material: { type: 'diffuse_light', emit: [rtRound(e.r), rtRound(e.g), rtRound(e.b)] }
        });
      } else if(l.userData.lightType === 'sun'){
        // Direction comes from the gizmo's position (pointing at the
        // world origin, same as the live sun light itself); placed far
        // away as a large emissive "sun disc" so it reads as roughly
        // directional/parallel light onto the scene.
        var dir = l.position.clone();
        if(dir.lengthSq() < 1e-6) dir.set(0, 1, 0); else dir.normalize();
        var pos = dir.multiplyScalar(RT_SUN_DISTANCE);
        var e = col.clone().multiplyScalar(lo.intensity * RT_SUN_EXPORT_SCALE);
        out.push({
          type: 'sphere',
          center: [rtRound(pos.x), rtRound(pos.y), rtRound(pos.z)],
          radius: RT_SUN_RADIUS,
          material: { type: 'diffuse_light', emit: [rtRound(e.r), rtRound(e.g), rtRound(e.b)] }
        });
      }
    });
    return out;
  }

  function rtExportCamera(){
    var target = orbit.target;
    return {
      lookfrom: [rtRound(camera.position.x), rtRound(camera.position.y), rtRound(camera.position.z)],
      lookat: [rtRound(target.x), rtRound(target.y), rtRound(target.z)],
      vup: [0, 1, 0],
      vfov: rtRound(camera.fov),
      defocusAngle: 0,
      focusDist: rtRound(Math.max(camera.position.distanceTo(target), 0.1))
    };
  }

  function serializeSceneForRayTracer(){
    var objs = rtExportObjects();
    objs.push(rtExportGround());
    objs = objs.concat(rtExportLights());
    return {
      version: 1,
      render: { imageWidth: 800, aspectRatio: rtRound(camera.aspect || (16 / 9)), samplesPerPixel: 60, maxDepth: 30 },
      camera: rtExportCamera(),
      objects: objs
    };
  }

  function exportForRayTracer(){
    if(!objects.length){
      showToast('Nothing to export yet — add some shapes first.');
      return;
    }
    var data = serializeSceneForRayTracer();
    var meshCount = 0, triCount = 0;
    data.objects.forEach(function(o){
      if(o.type === 'mesh'){ meshCount++; triCount += o.triangles.length; }
    });

    var json = JSON.stringify(data, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    saveFile('scene.json', blob, function(){
      showToast('Exported scene.json — ' + objects.length + ' object' + (objects.length === 1 ? '' : 's') +
        (meshCount ? ' (' + triCount + ' triangles across ' + meshCount + ' mesh' + (meshCount === 1 ? '' : 'es') + ')' : '') +
        ', ' + lights.length + ' light' + (lights.length === 1 ? '' : 's') + '.');
    });
  }

  window.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;

    if((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){
      e.preventDefault(); undo(); return;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y' || (e.shiftKey && (e.key === 'z' || e.key === 'Z')))){
      e.preventDefault(); redo(); return;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D') && (selected || multiSelected.length)){
      e.preventDefault(); duplicateSelected(); return;
    }

    // A multi-selection's gizmo only ever moves the group (see
    // updateMultiPivot) -- rotate/scale mode has no meaning for several
    // objects sharing one pivot, so those two shortcuts are ignored while
    // 2+ objects are selected together.
    if(e.key === 'w' || e.key === 'W') setMode('translate');
    else if((e.key === 'e' || e.key === 'E') && multiSelected.length <= 1) setMode('rotate');
    else if((e.key === 'r' || e.key === 'R') && multiSelected.length <= 1) setMode('scale');
    else if((e.key === 'f' || e.key === 'F') && selected){ frameSelected(); }
    else if((e.key === 'Delete' || e.key === 'Backspace') && (selected || multiSelected.length)){
      e.preventDefault();
      if(multiSelected.length) deleteMultiSelected();
      else if(selected.userData.kind === 'light') removeLight(selected);
      else removeObject(selected);
    } else if(e.key === 'Escape'){
      deselect();
    }
  });

  // Double-click the shape/light name in the inspector header to rename it

  function wireInspNameRename(){
    var el = document.getElementById('inspNameLabel');
    if(!el || !selected) return;
    el.addEventListener('dblclick', function(){
      var current = selected.userData.label || '';
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'name-edit';
      input.value = current;
      el.replaceWith(input);
      input.focus();
      input.select();
      var done = false;
      function commit(){
        if(done) return;
        done = true;
        var v = input.value.trim();
        if(v) selected.userData.label = v;
        renderInspector();
        renderOutliner();
      }
      function cancel(){
        if(done) return;
        done = true;
        renderInspector();
      }
      input.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ e.preventDefault(); commit(); }
        else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
        e.stopPropagation();
      });
      input.addEventListener('blur', commit);
    });
  }

  function renderMultiPanel(){

    inspector.innerHTML =

  function renderInspector(){
    if(multiSelected.length > 1){ renderMultiPanel(); return; }
    if(!selected){ renderScenePanel(); return; }

    if(selected.userData.kind === 'light'){
      var lightObj = selected.userData.lightObj;
      var lightDef = LIGHT_TYPES[selected.userData.lightType];
      inspector.innerHTML =
        '<div class="insp-head">' +
          '<div class="insp-title"><span class="panel-kind">Light source</span><span class="insp-name" id="inspNameLabel" title="Double-click to rename">' + escapeHtml(selected.userData.label) + '</span></div>' +
          '<div class="row" style="gap:6px">' +
            '<button class="iconbtn" id="dupBtn" title="Duplicate (Ctrl+D)">' + svgDuplicate() + '</button>' +
            '<button class="iconbtn" id="deleteLightBtn" title="Delete">' + svgTrash() + '</button>' +
          '</div>' +
        '</div>' +
        '<hr class="sep">' +
        '<div>' +
          '<span class="field-label">Color</span>' +
          '<input type="color" id="lightColor" value="#' + lightObj.color.getHexString() + '">' +
        '</div>' +
        '<div class="slider-row">' +
          '<div class="row between"><span class="field-label" style="margin:0">Intensity</span><span class="val mono" id="lightIntVal"></span></div>' +
          '<input type="range" id="lightIntensity" min="0" max="' + lightDef.intensityMax + '" step="0.1">' +
        '</div>' +
        '<div style="font-size:12px;color:var(--text-dim);line-height:1.5">' +
          (selected.userData.lightType === 'sun'
            ? 'Drag the glowing marker to change the angle the sun shines from.'
            : 'Drag the glowing sphere in the scene to move the light around.') +
        '</div>';

      document.getElementById('deleteLightBtn').addEventListener('click', function(){ removeLight(selected); });
      document.getElementById('dupBtn').addEventListener('click', duplicateSelected);
      wireInspNameRename();

      wireContinuous(document.getElementById('lightColor'), function(e){
        lightObj.color.set(e.target.value);
        selected.userData.core.material.color.set(e.target.value);
        selected.userData.glow.material.color.set(e.target.value);
      });
      var intInput = document.getElementById('lightIntensity');
      var intVal = document.getElementById('lightIntVal');
      intInput.value = lightObj.intensity;
      intVal.textContent = lightObj.intensity.toFixed(1);
      wireContinuous(intInput, function(e){
        lightObj.intensity = parseFloat(e.target.value);
        intVal.textContent = lightObj.intensity.toFixed(1);
      });
      updateHud();
      return;
    }

    // shape
    var mat = firstMaterial(selected);
    var presetKey = selected.userData.preset || 'matte';
    var label = selected.userData.label || 'Shape';
    var supportsEmissive = !!(mat && mat.emissive);
    var supportsClearcoat = !!(mat && ('clearcoat' in mat));
    var isGlowing = supportsEmissive && mat.emissive.getHex() !== 0;

    var presetsHtml = PRESET_ORDER.map(function(key){
      var sel = key === presetKey ? ' selected' : '';
      return '<button class="preset-btn' + sel + '" data-preset="' + key + '">' +
        '<span class="swatch" style="background:' + PRESET_SWATCH[key] + '"></span>' + PRESET_LABEL[key] +
        '</button>';
    }).join('');

    var glowFieldsHtml = isGlowing ?
      '<div class="row between">' +
        '<span class="field-label" style="margin:0">Glow color</span>' +
        '<input type="color" id="glowColor" value="#' + mat.emissive.getHexString() + '">' +
      '</div>' +
      '<div class="slider-row">' +
        '<div class="row between"><span class="field-label" style="margin:0">Glow intensity</span><span class="val mono" id="glowIntVal"></span></div>' +
        '<input type="range" id="glowIntensity" min="0" max="3" step="0.05">' +
      '</div>'
      : '';

    inspector.innerHTML =
      '<div class="insp-head">' +
        '<div class="insp-title"><span class="panel-kind">Selected shape</span><span class="insp-name" id="inspNameLabel" title="Double-click to rename">' + escapeHtml(label) + '</span></div>' +
        '<div class="row" style="gap:6px">' +
          '<button class="iconbtn" id="dupBtn" title="Duplicate (Ctrl+D)">' + svgDuplicate() + '</button>' +
          '<button class="iconbtn" id="deleteBtn" title="Delete">' + svgTrash() + '</button>' +
        '</div>' +
      '</div>' +
      '<hr class="sep">' +
      '<div>' +
        '<span class="field-label">Position</span>' +
        '<div class="xyz-row">' +
          '<input type="number" step="0.1" class="xyz-input mono" id="posX" title="X">' +
          '<input type="number" step="0.1" class="xyz-input mono" id="posY" title="Y">' +
          '<input type="number" step="0.1" class="xyz-input mono" id="posZ" title="Z">' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<span class="field-label">Rotation (°)</span>' +
        '<div class="xyz-row">' +
          '<input type="number" step="1" class="xyz-input mono" id="rotX" title="X">' +
          '<input type="number" step="1" class="xyz-input mono" id="rotY" title="Y">' +
          '<input type="number" step="1" class="xyz-input mono" id="rotZ" title="Z">' +
        '</div>' +
      '</div>' +
      '<div>' +
        '<span class="field-label">Scale</span>' +
        '<div class="xyz-row">' +
          '<input type="number" step="0.05" min="0.01" class="xyz-input mono" id="sclX" title="X">' +
          '<input type="number" step="0.05" min="0.01" class="xyz-input mono" id="sclY" title="Y">' +
          '<input type="number" step="0.05" min="0.01" class="xyz-input mono" id="sclZ" title="Z">' +
        '</div>' +
      '</div>' +
      '<hr class="sep">' +
      '<div>' +
        '<span class="field-label">Material</span>' +
        '<div class="presets">' + presetsHtml + '</div>' +
      '</div>' +
      (!selected.userData.imported ?
        '<div>' +
          '<span class="field-label">Texture</span>' +
          '<div class="row" style="gap:6px">' +
            '<button class="tbtn" id="texUploadBtn" style="flex:1;justify-content:center;border:1px solid var(--panel-border)">Upload image…</button>' +
            (selected.userData.textureDataUrl ? '<button class="iconbtn" id="texClearBtn" title="Remove texture">' + svgTrash() + '</button>' : '') +
          '</div>' +
          (selected.userData.textureDataUrl ? '<div style="font-size:11px;color:var(--text-dim);margin-top:5px">' + escapeHtml(selected.userData.textureName || 'Custom texture') + '</div>' : '') +
          '<input type="file" id="texInput" accept="image/*" style="display:none">' +
        '</div>'
        : '') +
      '<div class="row between">' +
        '<span class="field-label" style="margin:0">Color</span>' +
        '<input type="color" id="shapeColor" value="' + (mat && mat.color ? '#' + mat.color.getHexString() : '#8fa3c7') + '">' +
      '</div>' +
      '<div class="slider-row">' +
        '<div class="row between"><span class="field-label" style="margin:0">Roughness</span><span class="val mono" id="roughVal"></span></div>' +
        '<input type="range" id="roughness" min="0" max="1" step="0.01">' +
      '</div>' +
      '<div class="slider-row">' +
        '<div class="row between"><span class="field-label" style="margin:0">Metalness</span><span class="val mono" id="metalVal"></span></div>' +
        '<input type="range" id="metalness" min="0" max="1" step="0.01">' +
      '</div>' +
      '<div class="slider-row">' +
        '<div class="row between"><span class="field-label" style="margin:0">Opacity</span><span class="val mono" id="opacityVal"></span></div>' +
        '<input type="range" id="opacity" min="0" max="1" step="0.01">' +
      '</div>' +
      (supportsClearcoat ?
        '<div class="slider-row">' +
          '<div class="row between"><span class="field-label" style="margin:0">Clearcoat</span><span class="val mono" id="coatVal"></span></div>' +
          '<input type="range" id="clearcoat" min="0" max="1" step="0.01">' +
        '</div>'
        : '') +
      (supportsEmissive ?
        '<button class="toggle-btn' + (isGlowing ? ' on' : '') + '" id="glowToggle">Glow<span class="pip"></span></button>' + glowFieldsHtml
        : '');

    document.getElementById('deleteBtn').addEventListener('click', function(){ removeObject(selected); });
    document.getElementById('dupBtn').addEventListener('click', duplicateSelected);
    wireInspNameRename();

    if(!selected.userData.imported){
      var texBtn = document.getElementById('texUploadBtn');
      var texInput = document.getElementById('texInput');
      texBtn.addEventListener('click', function(){ texInput.click(); });
      texInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        if(!file.type || file.type.indexOf('image/') !== 0){
          showToast('Please choose an image file.');
          texInput.value = '';
          return;
        }
        var reader = new FileReader();
        reader.onload = function(ev){
          pushHistory();
          applyTexture(selected, ev.target.result, file.name, function(){
            renderInspector();
            showToast('Texture applied.');
          });
        };
        reader.onerror = function(){ showToast('Could not read that image file.'); };
        reader.readAsDataURL(file);
        texInput.value = '';
      });
      var texClearBtn = document.getElementById('texClearBtn');
      if(texClearBtn){
        texClearBtn.addEventListener('click', function(){
          pushHistory();
          clearTexture(selected);
          renderInspector();
        });
      }
    }

    function fillXyz(id, v){ document.getElementById(id).value = rtRound(v); }
    fillXyz('posX', selected.position.x); fillXyz('posY', selected.position.y); fillXyz('posZ', selected.position.z);
    fillXyz('rotX', THREE.MathUtils.radToDeg(selected.rotation.x));
    fillXyz('rotY', THREE.MathUtils.radToDeg(selected.rotation.y));
    fillXyz('rotZ', THREE.MathUtils.radToDeg(selected.rotation.z));
    fillXyz('sclX', selected.scale.x); fillXyz('sclY', selected.scale.y); fillXyz('sclZ', selected.scale.z);

    function wireXyzInput(id, onChange){
      var el = document.getElementById(id);
      el.addEventListener('input', function(){
        var v = parseFloat(el.value);
        if(isNaN(v)) return;
        beginChange();
        onChange(v);
      });
      el.addEventListener('change', function(){
        var v = parseFloat(el.value);
        if(!isNaN(v)) onChange(v);
        commitChange();
      });
    }
    wireXyzInput('posX', function(v){ selected.position.x = v; });
    wireXyzInput('posY', function(v){ selected.position.y = v; });
    wireXyzInput('posZ', function(v){ selected.position.z = v; });
    wireXyzInput('rotX', function(v){ selected.rotation.x = THREE.MathUtils.degToRad(v); });
    wireXyzInput('rotY', function(v){ selected.rotation.y = THREE.MathUtils.degToRad(v); });
    wireXyzInput('rotZ', function(v){ selected.rotation.z = THREE.MathUtils.degToRad(v); });
    wireXyzInput('sclX', function(v){ selected.scale.x = Math.max(0.01, v); });
    wireXyzInput('sclY', function(v){ selected.scale.y = Math.max(0.01, v); });
    wireXyzInput('sclZ', function(v){ selected.scale.z = Math.max(0.01, v); });

    Array.prototype.forEach.call(inspector.querySelectorAll('.preset-btn'), function(btn){
      btn.addEventListener('click', function(){
        pushHistory();
        applyPreset(selected, btn.getAttribute('data-preset'));
        renderInspector();
      });
    });

    wireContinuous(document.getElementById('shapeColor'), function(e){
      applyColor(selected, e.target.value);
    });

    var roughInput = document.getElementById('roughness');
    var roughVal = document.getElementById('roughVal');
    var metalInput = document.getElementById('metalness');
    var metalVal = document.getElementById('metalVal');
    var m0 = firstMaterial(selected);
    roughInput.value = m0 ? m0.roughness : 1;
    metalInput.value = m0 ? m0.metalness : 0;
    roughVal.textContent = parseFloat(roughInput.value).toFixed(2);
    metalVal.textContent = parseFloat(metalInput.value).toFixed(2);
    wireContinuous(roughInput, function(e){
      applyRoughness(selected, parseFloat(e.target.value));
      roughVal.textContent = parseFloat(e.target.value).toFixed(2);
      updateReflectionProbe(selected);
    });
    wireContinuous(metalInput, function(e){
      applyMetalness(selected, parseFloat(e.target.value));
      metalVal.textContent = parseFloat(e.target.value).toFixed(2);
      updateReflectionProbe(selected);
    });

    var opacityInput = document.getElementById('opacity');
    var opacityVal = document.getElementById('opacityVal');
    opacityInput.value = m0 ? m0.opacity : 1;
    opacityVal.textContent = parseFloat(opacityInput.value).toFixed(2);
    wireContinuous(opacityInput, function(e){
      applyOpacity(selected, parseFloat(e.target.value));
      opacityVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    if(supportsClearcoat){
      var coatInput = document.getElementById('clearcoat');
      var coatVal = document.getElementById('coatVal');
      coatInput.value = m0 ? m0.clearcoat : 0;
      coatVal.textContent = parseFloat(coatInput.value).toFixed(2);
      wireContinuous(coatInput, function(e){
        applyClearcoat(selected, parseFloat(e.target.value));
        coatVal.textContent = parseFloat(e.target.value).toFixed(2);
      });
    }

    if(supportsEmissive){
      document.getElementById('glowToggle').addEventListener('click', function(){
        pushHistory();
        if(isGlowing){
          applyEmissiveColor(selected, '#000000');
        } else {
          applyEmissiveColor(selected, GLOW_DEFAULT_COLOR);
          applyEmissiveIntensity(selected, GLOW_DEFAULT_INTENSITY);
        }
        renderInspector();
      });
      if(isGlowing){
        wireContinuous(document.getElementById('glowColor'), function(e){
          applyEmissiveColor(selected, e.target.value);
        });
        var glowIntInput = document.getElementById('glowIntensity');
        var glowIntVal = document.getElementById('glowIntVal');
        glowIntInput.value = mat.emissiveIntensity != null ? mat.emissiveIntensity : GLOW_DEFAULT_INTENSITY;
        glowIntVal.textContent = parseFloat(glowIntInput.value).toFixed(2);
        wireContinuous(glowIntInput, function(e){
          applyEmissiveIntensity(selected, parseFloat(e.target.value));
          glowIntVal.textContent = parseFloat(e.target.value).toFixed(2);
        });
      }
    }

    updateHud();
  }

  function renderScenePanel(){
    var groundHtml = GROUND_ORDER.map(function(key){
      var g = GROUND_TEXTURES[key];
      var sel = key === sceneState.groundTexture ? ' selected' : '';
      return '<button class="preset-btn' + sel + '" data-ground="' + key + '">' +
        '<span class="swatch" style="background:' + g.swatch + '"></span>' + g.label +
        '</button>';
    }).join('');

    var bgHtml = BG_ORDER.map(function(key){
      var p = BG_PRESETS[key];
      var sel = key === sceneState.bgPreset ? ' selected' : '';
      return '<button class="preset-btn' + sel + '" data-bg="' + key + '">' +
        '<span class="swatch" style="background:' + p.swatch + '"></span>' + p.label +
        '</button>';
    }).join('');

    var BG_MODE_LABEL = { preset: 'Presets', solid: 'Solid color', image: 'Image' };
    var bgModeTabsHtml = ['preset','solid','image'].map(function(m){
      var sel = m === bgActiveTab ? ' selected' : '';
      return '<button class="preset-btn' + sel + '" data-bgmode="' + m + '" style="justify-content:center">' + BG_MODE_LABEL[m] + '</button>';
    }).join('');

    var bgBodyHtml;
    if(bgActiveTab === 'solid'){
      bgBodyHtml = '<div class="row between">' +
        '<span class="field-label" style="margin:0">Sky color</span>' +
        '<input type="color" id="bgSolidColor" value="' + (sceneState.bgSolidColor || '#1b2130') + '">' +
        '</div>';
    } else if(bgActiveTab === 'image'){
      bgBodyHtml =
        '<button class="tbtn" id="bgImageUploadBtn" style="width:100%;justify-content:center;border:1px solid var(--panel-border)">Upload image…</button>' +
        '<input type="file" id="bgImageInput" accept="image/*" style="display:none">' +
        '<div style="font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:7px">' +
          (sceneState.bgMode === 'image' && sceneState.bgImageName
            ? 'Current: ' + escapeHtml(sceneState.bgImageName)
            : 'Pick a 360°/equirectangular panorama for best results — a regular photo will still work, just stretched around the horizon.') +
        '</div>';
    } else {
      bgBodyHtml = '<div class="presets">' + bgHtml + '</div>';
    }

    inspector.innerHTML =
      '<div class="insp-head">' +
        '<div class="insp-title"><span class="panel-kind">Nothing selected</span><span class="insp-name">Scene</span></div>' +
      '</div>' +
      '<hr class="sep">' +
      '<div>' +
        '<span class="field-label">Ground</span>' +
        '<div class="presets">' + groundHtml + '</div>' +
      '</div>' +
      '<div class="row between">' +
        '<span class="field-label" style="margin:0">Ground tint</span>' +
        '<input type="color" id="groundColor" value="' + sceneState.groundColor + '">' +
      '</div>' +
      '<div>' +
        '<span class="field-label">Backdrop</span>' +
        '<div class="presets">' + bgModeTabsHtml + '</div>' +
      '</div>' +
      '<div>' + bgBodyHtml + '</div>' +
      '<hr class="sep">' +
      '<div class="slider-row">' +
        '<div class="row between"><span class="field-label" style="margin:0">Shadow softness</span><span class="val mono" id="shadowSoftVal"></span></div>' +
        '<input type="range" id="shadowSoftness" min="0" max="8" step="0.1">' +
      '</div>' +
      '<hr class="sep">' +
      '<button class="toggle-btn' + (sceneState.bloomEnabled ? ' on' : '') + '" id="bloomToggle">Bloom (glow post-fx)<span class="pip"></span></button>' +
      (sceneState.bloomEnabled ?
        '<div class="slider-row">' +
          '<div class="row between"><span class="field-label" style="margin:0">Bloom strength</span><span class="val mono" id="bloomStrengthVal"></span></div>' +
          '<input type="range" id="bloomStrength" min="0" max="3" step="0.05">' +
        '</div>' +
        '<div class="slider-row">' +
          '<div class="row between"><span class="field-label" style="margin:0">Bloom radius</span><span class="val mono" id="bloomRadiusVal"></span></div>' +
          '<input type="range" id="bloomRadius" min="0" max="1" step="0.02">' +
        '</div>' +
        '<div class="slider-row">' +
          '<div class="row between"><span class="field-label" style="margin:0">Bloom threshold</span><span class="val mono" id="bloomThresholdVal"></span></div>' +
          '<input type="range" id="bloomThreshold" min="0" max="1" step="0.02">' +
        '</div>'
        : '') +
      '<div style="font-size:12px;color:var(--text-dim);line-height:1.5">Click any shape or the light to edit it here.</div>';

    wireContinuous(document.getElementById('groundColor'), function(e){
      setGroundColor(e.target.value);
    });

    Array.prototype.forEach.call(inspector.querySelectorAll('[data-ground]'), function(btn){
      btn.addEventListener('click', function(){
        pushHistory();
        setGroundTexture(btn.getAttribute('data-ground'));
        renderScenePanel();
      });
    });

    Array.prototype.forEach.call(inspector.querySelectorAll('[data-bg]'), function(btn){
      btn.addEventListener('click', function(){
        pushHistory();
        setBackgroundPreset(btn.getAttribute('data-bg'));
        renderScenePanel();
      });
    });

    Array.prototype.forEach.call(inspector.querySelectorAll('[data-bgmode]'), function(btn){
      btn.addEventListener('click', function(){
        var mode = btn.getAttribute('data-bgmode');
        bgActiveTab = mode;
        if(mode === 'solid'){
          pushHistory();
          setBackgroundSolid(sceneState.bgSolidColor);
        } else if(mode === 'preset'){
          pushHistory();
          setBackgroundPreset(sceneState.bgPreset);
        } else if(mode === 'image' && sceneState.bgImageDataUrl){
          pushHistory();
          setBackgroundImageFromDataUrl(sceneState.bgImageDataUrl, sceneState.bgImageName);
        }
        renderScenePanel();
      });
    });

    if(bgActiveTab === 'solid'){
      wireContinuous(document.getElementById('bgSolidColor'), function(e){
        setBackgroundSolid(e.target.value);
      });
    }

    if(bgActiveTab === 'image'){
      var bgImgBtn = document.getElementById('bgImageUploadBtn');
      var bgImgInput = document.getElementById('bgImageInput');
      bgImgBtn.addEventListener('click', function(){ bgImgInput.click(); });
      bgImgInput.addEventListener('change', function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        if(!file.type || file.type.indexOf('image/') !== 0){
          showToast('Please choose an image file.');
          bgImgInput.value = '';
          return;
        }
        var reader = new FileReader();
        reader.onload = function(ev){
          pushHistory();
          setBackgroundImageFromDataUrl(ev.target.result, file.name, function(){
            renderScenePanel();
            showToast('Skybox image applied.');
          });
        };
        reader.onerror = function(){ showToast('Could not read that image file.'); };
        reader.readAsDataURL(file);
        bgImgInput.value = '';
      });
    }

    var shadowInput = document.getElementById('shadowSoftness');
    var shadowVal = document.getElementById('shadowSoftVal');
    shadowInput.value = sceneState.shadowSoftness;
    shadowVal.textContent = parseFloat(shadowInput.value).toFixed(1);
    wireContinuous(shadowInput, function(e){
      applyShadowSoftness(parseFloat(e.target.value));
      shadowVal.textContent = parseFloat(e.target.value).toFixed(1);
    });

    document.getElementById('bloomToggle').addEventListener('click', function(){
      sceneState.bloomEnabled = !sceneState.bloomEnabled;
      applyBloomSettings();
      renderScenePanel();
    });
    if(sceneState.bloomEnabled){
      var strengthInput = document.getElementById('bloomStrength');
      var strengthVal = document.getElementById('bloomStrengthVal');
      strengthInput.value = sceneState.bloomStrength;
      strengthVal.textContent = parseFloat(strengthInput.value).toFixed(2);
      wireContinuous(strengthInput, function(e){
        sceneState.bloomStrength = parseFloat(e.target.value);
        applyBloomSettings();
        strengthVal.textContent = sceneState.bloomStrength.toFixed(2);
      });
      var radiusInput = document.getElementById('bloomRadius');
      var radiusVal = document.getElementById('bloomRadiusVal');
      radiusInput.value = sceneState.bloomRadius;
      radiusVal.textContent = parseFloat(radiusInput.value).toFixed(2);
      wireContinuous(radiusInput, function(e){
        sceneState.bloomRadius = parseFloat(e.target.value);
        applyBloomSettings();
        radiusVal.textContent = sceneState.bloomRadius.toFixed(2);
      });
      var thresholdInput = document.getElementById('bloomThreshold');
      var thresholdVal = document.getElementById('bloomThresholdVal');
      thresholdInput.value = sceneState.bloomThreshold;
      thresholdVal.textContent = parseFloat(thresholdInput.value).toFixed(2);
      wireContinuous(thresholdInput, function(e){
        sceneState.bloomThreshold = parseFloat(e.target.value);
        applyBloomSettings();
        thresholdVal.textContent = sceneState.bloomThreshold.toFixed(2);
      });
    }

    updateHud();
  }

  setOutlinerOpen(window.innerWidth > 680);
  toggleOutlinerBtn.addEventListener('click', function(){
    setOutlinerOpen(!outlinerEl.classList.contains('open'));
  });

  function outlinerRowHtml(key, name, color, removable, isSelected, isMultiSelected){
    var cls = 'outliner-row' + (isSelected ? ' selected' : '') + (isMultiSelected ? ' multiselected' : '');
    return '<div class="' + cls + '" data-key="' + key + '">' +
      '<span class="dot2" style="background:' + color + '"></span>' +
      '<span class="name" data-key="' + key + '" title="Double-click to rename">' + escapeHtml(name) + '</span>' +
      (removable ? '<button class="rm" data-key="' + key + '" title="Delete">' + svgTrash() + '</button>' : '') +
      '</div>';
  }

  function outlinerRefForKey(key){
    var parts = key.split(':');
    var idx = parseInt(parts[1], 10);
    return parts[0] === 'light' ? lights[idx] : objects[idx];
  }

  // Toggles which row shows as selected without touching any other DOM --
  // see the comment on select()/deselect() for why a full rebuild here
  // was actively harmful, not just wasteful.
  function updateOutlinerSelection(){
    Array.prototype.forEach.call(outlinerListEl.querySelectorAll('.outliner-row'), function(row){
      var ref = outlinerRefForKey(row.getAttribute('data-key'));
      row.classList.toggle('selected', ref === selected);
      row.classList.toggle('multiselected', multiSelected.indexOf(ref) >= 0);
    });
  }

  // Delegated on outlinerListEl itself (which persists across renders --
  // only its innerHTML gets replaced) rather than on the individual .name
  // spans a renderOutliner() call creates fresh each time. Attaching
  // directly to those spans looked right but doesn't survive a real
  // double-click: browsers pair a dblclick with whatever element the
  // *first* click of the pair hit, not whatever's live at that point when
  // it fires -- and that first click's own bubbling triggers select() ->
  // renderOutliner(), which immediately replaces every row (including the
  // one just clicked) before the second click/dblclick ever arrives. The
  // dblclick then lands on an already-detached element and silently does
  // nothing. Delegating to the stable parent sidesteps that entirely.
  outlinerListEl.addEventListener('dblclick', function(e){
    var nameEl = e.target.closest('.name');
    if(!nameEl || !outlinerListEl.contains(nameEl)) return;
    e.stopPropagation();
    var ref = outlinerRefForKey(nameEl.getAttribute('data-key'));
    if(!ref) return;
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'name-edit';
    input.value = ref.userData.label || '';
    nameEl.replaceWith(input);
    input.focus();
    input.select();
    var done = false;
    function commit(){
      if(done) return;
      done = true;
      var v = input.value.trim();
      if(v) ref.userData.label = v;
      renderOutliner();
      if(selected === ref) renderInspector();
    }
    function cancel(){
      if(done) return;
      done = true;
      renderOutliner();
    }
    input.addEventListener('keydown', function(ev){
      if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }
      else if(ev.key === 'Escape'){ ev.preventDefault(); cancel(); }
      ev.stopPropagation();
    });
    input.addEventListener('blur', commit);
    input.addEventListener('click', function(ev){ ev.stopPropagation(); });
  });

  function renderOutliner(){
    var rows = [];
    lights.forEach(function(l, i){
      rows.push(outlinerRowHtml('light:' + i, l.userData.label || 'Light', '#' + l.userData.lightObj.color.getHexString(), true, selected === l, multiSelected.indexOf(l) >= 0));
    });
    objects.forEach(function(o, i){
      rows.push(outlinerRowHtml('obj:' + i, o.userData.label || 'Shape', o.userData.color || '#8fa3c7', true, selected === o, multiSelected.indexOf(o) >= 0));
    });
    outlinerListEl.innerHTML = rows.join('');

    Array.prototype.forEach.call(outlinerListEl.querySelectorAll('.outliner-row'), function(row){
      row.addEventListener('click', function(e){
        if(e.target.closest('.rm')) return;
        var key = row.getAttribute('data-key');
        var parts = key.split(':');
        var idx = parseInt(parts[1], 10);
        var ref = parts[0] === 'light' ? lights[idx] : objects[idx];
        if(!ref) return;
        if(e.shiftKey || e.ctrlKey || e.metaKey) toggleMultiSelect(ref);
        else select(ref);
      });
    });
    Array.prototype.forEach.call(outlinerListEl.querySelectorAll('.rm'), function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var key = btn.getAttribute('data-key');
        var parts = key.split(':');
        var idx = parseInt(parts[1], 10);
        if(parts[0] === 'light'){
          if(lights[idx]) removeLight(lights[idx]);
        } else {
          if(objects[idx]) removeObject(objects[idx]);
        }
      });
    });
  }

  // ---------------------------------------------------------------
  // HUD + toast
  // ---------------------------------------------------------------
  var objCountEl = document.getElementById('objCount');
  var selPillEl = document.getElementById('selPill');
  var selNameEl = document.getElementById('selName');

  function updateHud(){
    objCountEl.textContent = objects.length;
    if(selected){
      selPillEl.style.display = '';
      selNameEl.textContent = selected.userData.label || (selected.userData.kind === 'light' ? 'Light' : 'Shape');
    } else {
      selPillEl.style.display = 'none';
    }
    renderOutliner();
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  // ---------------------------------------------------------------
  // Render loop
  // ---------------------------------------------------------------
  var envFrame = 0;
  var probeCursor = 0;
  var probeWorldPos = new THREE.Vector3();
  function tick(){
    orbit.update();
    lights.forEach(function(l){ syncLightTransform(l); });
    objects.forEach(function(o){
      if(o.userData.blobShadows){
        var m = firstMaterial(o);
        updateBlobShadowsForObject(o, m ? m.opacity : 1);
      }
    });
    scene.updateMatrixWorld();

    var gizmoWasVisible = xform.visible;
    xform.visible = false;

    // Shared cubemap: used by the ground and any non-metal material
    // (matte, and low-Fresnel "Clear" glass). Nothing that relies on it
    // reflects itself noticeably, so it needs no per-object hiding.
    envFrame = (envFrame + 1) % 2;
    if(envFrame === 0){
      cubeCamera.update(renderer, scene);
    }

    // Per-object probes: update a couple of them per frame, round-robin,
    // so mirror/metal objects reflect their surroundings — including
    // each other — live, without paying the cost of every probe every
    // frame. Each object is hidden only for its OWN capture, so it never
    // reflects itself but still shows up correctly in everyone else's.
    var reflective = objects.filter(function(o){ return !!o.userData.ownProbe; });
    if(reflective.length){
      var perFrame = 2;
      for(var i=0; i<perFrame && i<reflective.length; i++){
        var obj = reflective[probeCursor % reflective.length];
        probeCursor++;
        var probe = obj.userData.ownProbe;
        var wasVisible = obj.visible;
        obj.visible = false;
        obj.getWorldPosition(probeWorldPos);
        probe.cubeCamera.position.copy(probeWorldPos);
        probe.cubeCamera.update(renderer, scene);
        obj.visible = wasVisible;
      }
    }

    xform.visible = gizmoWasVisible;

    if(bloomPass.enabled) composer.render();
    else renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  renderScenePanel();
  updateHistoryButtons();
  updateHud();
})();
</script>
