<title>Lightbox Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f4;
    --panel:#ffffff;
    --panel-border:#dde1e8;
    --text:#14171c;
    --text-dim:#5c6270;
    --accent:#dd8a1f;
    --accent-ink:#1c1200;
    --danger:#c84343;
    --canvas-fallback:#c9d2de;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1015;
      --panel:#181b22;
      --panel-border:#2a2e38;
      --text:#eef0f4;
      --text-dim:#9aa1af;
      --accent:#f0a53a;
      --accent-ink:#1c1200;
      --danger:#e46f6f;
      --canvas-fallback:#11141a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1015;
    --panel:#181b22;
    --panel-border:#2a2e38;
    --text:#eef0f4;
    --text-dim:#9aa1af;
    --accent:#f0a53a;
    --accent-ink:#1c1200;
    --danger:#e46f6f;
    --canvas-fallback:#11141a;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #viewport{
    position:fixed; inset:0;
    background:var(--canvas-fallback);
    touch-action:none;
  }
  #viewport canvas{ display:block; width:100%; height:100%; }

  /* ---------- Top toolbar ---------- */
  #toolbar{
    position:fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left:14px;
    right:14px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    z-index:20;
    pointer-events:none;
  }
  .toolgroup{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:4px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:5px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    overflow-x:auto;
    max-width:100%;
  }
  .brand{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
    padding:8px 12px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    white-space:nowrap;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    flex:none;
  }
  .spacer{ flex:1 1 auto; min-width:8px; }

  button.tbtn{
    display:flex; align-items:center; gap:6px;
    background:transparent;
    border:1px solid transparent;
    color:var(--text);
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:7px 11px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  button.tbtn:hover{ background:var(--bg); }
  button.tbtn:active{ transform:translateY(1px); }
  button.tbtn.active{
    background:var(--accent);
    color:var(--accent-ink);
  }
  button.tbtn:disabled{ opacity:.35; cursor:default; }
  button.tbtn:disabled:hover{ background:transparent; }
  button.tbtn.iconOnly{ padding:7px; }
  button.tbtn svg{ width:16px; height:16px; flex:none; }

  button.tbtn.danger{ color:var(--danger); }
  button.tbtn.danger:hover{ background:color-mix(in srgb, var(--danger) 14%, transparent); }

  /* ---------- Floating panels (inspector + outliner) ---------- */
  #inspector, #outliner{
    position:fixed;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.14);
    z-index:20;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    transition:transform .18s ease;
  }
  #inspector{
    top: calc(64px + env(safe-area-inset-top, 0px));
    right:14px;
    width:270px;
    max-width:calc(100vw - 28px);
    transform:translateX(calc(100% + 28px));
  }
  #inspector.open{ transform:translateX(0); }

  #outliner{
    top: calc(64px + env(safe-area-inset-top, 0px));
    left:14px;
    width:210px;
    max-width:calc(100vw - 28px);
    max-height:min(46vh, 380px);
    padding:12px;
    gap:8px;
    transform:translateX(calc(-100% - 28px));
  }
  #outliner.open{ transform:translateX(0); }
  #outlinerList{ overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin:-2px; padding:2px; }

  .panel-kind{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--text-dim); font-weight:600;
  }

  .insp-head{
    display:flex; align-items:center; justify-content:space-between;
  }
  .insp-title{
    display:flex; flex-direction:column; gap:2px;
  }
  .insp-name{ font-size:16px; font-weight:700; }
  .iconbtn{
    background:transparent; border:1px solid var(--panel-border);
    border-radius:8px; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:pointer; flex:none;
  }
  .iconbtn:hover{ color:var(--danger); border-color:var(--danger); }
  .iconbtn svg{ width:15px; height:15px; }

  .field-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-dim); font-weight:600; margin-bottom:7px; display:block;
  }

  .presets{
    display:grid; grid-template-columns:1fr 1fr; gap:7px;
  }
  .preset-btn{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    border-radius:9px;
    border:1px solid var(--panel-border);
    background:var(--bg);
    color:var(--text);
    font:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer;
  }
  .preset-btn .swatch{
    width:15px; height:15px; border-radius:50%;
    flex:none; border:1px solid rgba(0,0,0,.15);
  }
  .preset-btn.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
    background:color-mix(in srgb, var(--accent) 12%, var(--bg));
  }

  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }

  input[type="color"]{
    -webkit-appearance:none; appearance:none;
    width:34px; height:28px; border:1px solid var(--panel-border);
    border-radius:7px; padding:0; background:none; cursor:pointer; flex:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{ padding:2px; }
  input[type="color"]::-webkit-color-swatch{ border-radius:5px; border:none; }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px; border-radius:2px;
    background:var(--panel-border); outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:15px; height:15px; border-radius:50%;
    background:var(--accent); cursor:pointer;
    border:2px solid var(--panel);
    box-shadow:0 0 0 1px var(--accent);
  }
  input[type="range"]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:2px solid var(--panel);
  }

  .slider-row{ display:flex; flex-direction:column; gap:6px; }
  .slider-row .row.between{ font-size:11.5px; }
  .slider-row .val{ color:var(--text-dim); }

  hr.sep{ border:none; border-top:1px solid var(--panel-border); margin:2px 0; }

  .toggle-btn{
    display:flex; align-items:center; justify-content:space-between;
    width:100%;
    padding:8px 10px;
    border-radius:9px;
    border:1px solid var(--panel-border);
    background:var(--bg);
    color:var(--text);
    font:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer;
  }
  .toggle-btn .pip{
    width:32px; height:18px; border-radius:999px;
    background:var(--panel-border); position:relative; flex:none;
    transition:background .12s ease;
  }
  .toggle-btn .pip::after{
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
    border-radius:50%; background:var(--panel); transition:left .12s ease;
  }
  .toggle-btn.on .pip{ background:var(--accent); }
  .toggle-btn.on .pip::after{ left:16px; }

  .outliner-row{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px;
    cursor:pointer; font-size:13px; font-weight:600;
  }
  .outliner-row:hover{ background:var(--bg); }
  .outliner-row.selected{ background:color-mix(in srgb, var(--accent) 16%, var(--bg)); }
  .outliner-row .dot2{ width:9px; height:9px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.15); }
  .outliner-row .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .outliner-row .rm{
    opacity:0; background:none; border:none; color:var(--text-dim); cursor:pointer;
    padding:2px; display:flex; flex:none;
  }
  .outliner-row:hover .rm{ opacity:1; }
  .outliner-row .rm:hover{ color:var(--danger); }
  .outliner-row .rm svg{ width:13px; height:13px; }
  .outliner-empty{ font-size:12px; color:var(--text-dim); padding:6px 2px; }

  /* ---------- Bottom HUD ---------- */
  #hud{
    position:fixed;
    left:14px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index:20;
    display:flex; flex-direction:column; gap:6px;
    max-width:calc(100vw - 28px);
  }
  #hud .pill{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:999px;
    padding:7px 13px;
    font-size:12px;
    color:var(--text-dim);
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    display:flex; align-items:center; gap:8px;
    width:fit-content;
  }
  #hud .pill b{ color:var(--text); font-weight:700; }
  #hud .hint{ display:none; }
  @media (min-width:640px){
    #hud .hint{ display:flex; }
  }

  /* ---------- Toast ---------- */
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  #toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%,12px);
    background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600;
    z-index:40; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    max-width:calc(100vw - 40px); text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #fileInput{ display:none; }

  @media (max-width:680px){
    #inspector{
      left:14px; right:14px; width:auto; max-width:none;
      top:auto;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      transform:translateY(calc(100% + 28px));
    }
    #inspector.open{ transform:translateY(0); }
    #outliner{
      left:14px; right:14px; width:auto; max-width:none;
    }
    #hud{ bottom: auto; top: calc(64px + env(safe-area-inset-top, 0px)); }
  }
</style>

<div id="viewport"><canvas id="c"></canvas></div>

<div id="toolbar">
  <div class="brand"><span class="dot"></span>Lightbox Studio</div>

  <div class="toolgroup" id="addGroup">
    <button class="tbtn" id="addBox" title="Add a box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg>
      Box
    </button>
    <button class="tbtn" id="addSphere" title="Add a sphere">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12c3 2.5 15 2.5 18 0"/><path d="M12 3c2.5 3 2.5 15 0 18"/></svg>
      Sphere
    </button>
    <button class="tbtn" id="addCylinder" title="Add a cylinder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-13"/></svg>
      Cylinder
    </button>
    <button class="tbtn" id="importBtn" title="Import a .glb / .gltf model">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      Import
    </button>
    <input type="file" id="fileInput" accept=".glb,.gltf">
  </div>

  <div class="toolgroup" id="modeGroup">
    <button class="tbtn" id="modeMove" title="Move (W)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M2 12h20"/><path d="M5 9l-3 3 3 3M19 9l3 3-3 3M9 5l3-3 3 3M9 19l3 3 3-3"/></svg>
      Move
    </button>
    <button class="tbtn" id="modeRotate" title="Rotate (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
      Rotate
    </button>
    <button class="tbtn" id="modeScale" title="Scale (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15v5h5M20 9V4h-5M20 4 13 11M4 20l7-7"/></svg>
      Scale
    </button>
  </div>

  <div class="toolgroup">
    <button class="tbtn iconOnly" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <button class="tbtn iconOnly" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg>
    </button>
  </div>

  <div class="toolgroup">
    <button class="tbtn iconOnly" id="saveBtn" title="Save scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5V4Z"/><path d="M8 4v5h7V4"/><path d="M8 14h8v6H8z"/></svg>
    </button>
    <button class="tbtn iconOnly" id="loadBtn" title="Load saved scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3V7Z"/></svg>
    </button>
  </div>

  <div class="toolgroup">
    <button class="tbtn iconOnly" id="camFront" title="Front view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="tbtn iconOnly" id="camTop" title="Top view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16"/></svg>
    </button>
    <button class="tbtn iconOnly" id="camSide" title="Side view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16"/></svg>
    </button>
    <button class="tbtn iconOnly" id="camReset" title="Reset camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
    </button>
  </div>

  <div class="spacer"></div>

  <div class="toolgroup">
    <button class="tbtn iconOnly active" id="toggleOutliner" title="Show/hide object list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
  </div>

  <div class="toolgroup">
    <button class="tbtn danger" id="clearBtn" title="Remove all placed shapes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
      Clear
    </button>
  </div>
</div>

<div id="outliner">
  <div class="panel-kind">Objects</div>
  <div id="outlinerList"></div>
</div>

<div id="inspector">
  <!-- populated by JS -->
</div>

<div id="hud">
  <div class="pill"><b id="objCount">0</b>&nbsp;objects <span id="selPill" style="display:none">· <b id="selName"></b> selected</span></div>
  <div class="pill hint">Click a shape to select · drag the gizmo to move it · <span class="mono">W</span>/<span class="mono">E</span>/<span class="mono">R</span> to switch mode · <span class="mono">Del</span> to remove · <span class="mono">Ctrl</span>+<span class="mono">Z</span> to undo</div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
(function(){
  "use strict";

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---------------------------------------------------------------
  // Theme
  // ---------------------------------------------------------------
  function prefersDark(){
    var stamp = document.documentElement.getAttribute('data-theme');
    if(stamp === 'dark') return true;
    if(stamp === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  // ---------------------------------------------------------------
  // Renderer / scene / camera
  // ---------------------------------------------------------------
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var dark = prefersDark();

  var DEFAULT_CAM = { pos:[7, 5.5, 8], target:[0, 0.8, 0] };
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  camera.position.set(DEFAULT_CAM.pos[0], DEFAULT_CAM.pos[1], DEFAULT_CAM.pos[2]);

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------
  // Live reflection cubemap: a camera parked at the center of the
  // sandbox re-renders the REAL scene (ground, shapes, the light) into a
  // cubemap every few frames. Every material's envMap points at that same
  // texture, so mirror/metal surfaces reflect what's actually around them
  // right now, and the reflection updates as shapes are added or moved.
  // ---------------------------------------------------------------
  var cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, {
    format: THREE.RGBAFormat,
    generateMipmaps: true,
    minFilter: THREE.LinearMipmapLinearFilter
  });
  var envMap = cubeRenderTarget.texture;
  var cubeCamera = new THREE.CubeCamera(0.1, 60, cubeRenderTarget);
  cubeCamera.position.set(0, 1.2, 0);
  scene.add(cubeCamera);

  // ---------------------------------------------------------------
  // Lights
  // ---------------------------------------------------------------
  var hemi = new THREE.HemisphereLight(dark ? 0x2b3550 : 0xdfe8f5, dark ? 0x15130f : 0xcbbfa8, 0.55);
  scene.add(hemi);

  var DEFAULT_LIGHT_POS = [3.5, 4.5, 2.5];
  var DEFAULT_LIGHT_COLOR = 0xfff1d8;
  var DEFAULT_LIGHT_INTENSITY = 2.4;

  var pointLight = new THREE.PointLight(DEFAULT_LIGHT_COLOR, DEFAULT_LIGHT_INTENSITY, 0, 2);
  pointLight.castShadow = true;
  pointLight.shadow.mapSize.set(1024, 1024);
  pointLight.shadow.camera.near = 0.5;
  pointLight.shadow.camera.far = 30;
  pointLight.shadow.bias = -0.002;
  scene.add(pointLight);

  var bulbColor = 0xffb454;
  var lightGizmo = new THREE.Group();
  lightGizmo.position.set(DEFAULT_LIGHT_POS[0], DEFAULT_LIGHT_POS[1], DEFAULT_LIGHT_POS[2]);
  var bulbCore = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 20, 16),
    new THREE.MeshBasicMaterial({ color: bulbColor })
  );
  var bulbGlow = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 20, 16),
    new THREE.MeshBasicMaterial({ color: bulbColor, transparent: true, opacity: 0.22, depthWrite: false })
  );
  lightGizmo.add(bulbCore, bulbGlow);
  lightGizmo.userData.selectable = true;
  lightGizmo.userData.kind = 'light';
  scene.add(lightGizmo);
  pointLight.position.copy(lightGizmo.position);
  pointLight.color.setHex(DEFAULT_LIGHT_COLOR);
  bulbCore.material.color.setHex(bulbColor);
  bulbGlow.material.color.setHex(bulbColor);

  // ---------------------------------------------------------------
  // Ground + background (Scene settings)
  // ---------------------------------------------------------------
  function checkerTexture(isDark){
    var size = 256;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var a = isDark ? '#20242e' : '#e7eaf0';
    var b = isDark ? '#262b37' : '#dde1ea';
    var cells = 8, cell = size / cells;
    for(var i=0;i<cells;i++){
      for(var j=0;j<cells;j++){
        ctx.fillStyle = ((i+j)%2===0) ? a : b;
        ctx.fillRect(i*cell, j*cell, cell, cell);
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(10,10);
    tex.anisotropy = 4;
    return tex;
  }

  // Draws an ellipse speckle plus wrapped copies near the canvas edges so
  // the tiled ground textures below don't show a hard seam at the repeat.
  function drawSpeckle(ctx, size, x, y, r, ry, col){
    var xs = [x];
    if(x < r) xs.push(x + size);
    if(x > size - r) xs.push(x - size);
    var ys = [y];
    if(y < ry) ys.push(y + size);
    if(y > size - ry) ys.push(y - size);
    ctx.fillStyle = col;
    xs.forEach(function(xx){
      ys.forEach(function(yy){
        ctx.beginPath();
        ctx.ellipse(xx, yy, r, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    });
  }

  function noiseGroundTexture(colorSet, isDark, opts){
    var size = 256;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var colors = isDark ? colorSet.dark : colorSet.light;
    ctx.fillStyle = colors[0];
    ctx.fillRect(0, 0, size, size);
    ctx.globalAlpha = opts.alpha != null ? opts.alpha : 0.5;
    for(var i=0;i<opts.speckles;i++){
      var col = colors[1 + Math.floor(Math.random() * (colors.length - 1))];
      var x = Math.random() * size, y = Math.random() * size;
      var r = opts.minR + Math.random() * (opts.maxR - opts.minR);
      var ry = r * (0.6 + Math.random() * 0.5);
      drawSpeckle(ctx, size, x, y, r, ry, col);
    }
    ctx.globalAlpha = 1;
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(opts.repeat || 9, opts.repeat || 9);
    tex.anisotropy = 4;
    return tex;
  }

  var GROUND_TEXTURES = {
    plain:   { label:'Plain',   swatch:'#c7cbd2', build: function(){ return null; } },
    checker: { label:'Checker', swatch:'#cfd6e0', build: function(isDark){ return checkerTexture(isDark); } },
    dirt:    { label:'Dirt',    swatch:'#8a5a3c', build: function(isDark){
      return noiseGroundTexture({
        light: ['#93613f','#7f5334','#a4754c','#8f6541'],
        dark:  ['#3c2818','#332012','#472f1c','#3a2716']
      }, isDark, { speckles: 1100, minR: 2, maxR: 6.5, alpha: 0.5, repeat: 9 });
    } },
    grass:   { label:'Grass',   swatch:'#5f9a52', build: function(isDark){
      return noiseGroundTexture({
        light: ['#5f9a52','#6fae5f','#4f8a46','#7cb86a'],
        dark:  ['#20361c','#2a4522','#193014','#33542a']
      }, isDark, { speckles: 1500, minR: 1.5, maxR: 4, alpha: 0.55, repeat: 9 });
    } },
    cement:  { label:'Cement',  swatch:'#a9adb3', build: function(isDark){
      return noiseGroundTexture({
        light: ['#b7bac0','#aeb2b8','#c3c6cb','#a5a8ae'],
        dark:  ['#35373b','#2e3033','#3c3e42','#292b2e']
      }, isDark, { speckles: 1200, minR: 1, maxR: 5, alpha: 0.28, repeat: 7 });
    } }
  };
  var GROUND_ORDER = ['plain','checker','dirt','grass','cement'];
  var groundTextureCache = {};
  function getGroundTexture(key){
    if(!GROUND_TEXTURES[key]) key = 'checker';
    if(key === 'plain') return null;
    if(!groundTextureCache[key]) groundTextureCache[key] = GROUND_TEXTURES[key].build(dark);
    return groundTextureCache[key];
  }

  var BG_PRESETS = {
    studio:   { label:'Studio',    swatch:'#dfe8f5', top:'#dfe8f5', mid:'#eef1f6', bottom:'#f4f0e8', dtop:'#1b2130', dmid:'#0f121a', dbottom:'#08090c' },
    clearsky: { label:'Clear Sky', swatch:'#4fa3dd', top:'#2f8ddb', mid:'#7ec3ef', bottom:'#e3f3fb', dtop:'#0c2338', dmid:'#123a5c', dbottom:'#1e527c' },
    cloudy:   { label:'Cloudy',    swatch:'#b9c7d2', top:'#8fa9bd', mid:'#c7d3dc', bottom:'#e7ebee', dtop:'#232c36', dmid:'#333d47', dbottom:'#4a535c', clouds:true },
    overcast: { label:'Overcast',  swatch:'#d2d7de', top:'#c7cdd6', mid:'#d7dbe2', bottom:'#e4e6ea', dtop:'#22242a', dmid:'#2a2d33', dbottom:'#33363d' },
    sunset:   { label:'Sunset',    swatch:'#f4667a', top:'#ffb27a', mid:'#f4667a', bottom:'#3d2a52', dtop:'#3a2440', dmid:'#26173a', dbottom:'#120c22' },
    night:    { label:'Night',     swatch:'#0b0f1c', top:'#131a2b', mid:'#0b0f1c', bottom:'#05070f', dtop:'#10141f', dmid:'#0a0d16', dbottom:'#04050a' }
  };
  var BG_ORDER = ['studio','clearsky','cloudy','overcast','sunset','night'];

  function buildSkyTexture(presetKey, isDark){
    var preset = BG_PRESETS[presetKey] || BG_PRESETS.studio;
    var w = preset.clouds ? 128 : 8;
    var h = 256;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, isDark ? preset.dtop : preset.top);
    g.addColorStop(0.55, isDark ? preset.dmid : preset.mid);
    g.addColorStop(1, isDark ? preset.dbottom : preset.bottom);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    if(preset.clouds){
      var cloudColor = isDark ? 'rgba(214,219,226,0.45)' : 'rgba(255,255,255,0.85)';
      try{ ctx.filter = 'blur(4px)'; }catch(err){}
      for(var i=0;i<9;i++){
        var cx = Math.random()*w;
        var cy = h*0.12 + Math.random()*h*0.35;
        var rx = w*(0.14+Math.random()*0.18);
        var ry = rx*(0.35+Math.random()*0.25);
        ctx.fillStyle = cloudColor;
        ctx.beginPath();
        ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
        ctx.fill();
      }
      ctx.filter = 'none';
    }

    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  var sceneState = { groundColor: '#ffffff', groundTexture: 'checker', bgPreset: 'studio' };

  function setBackgroundPreset(key){
    if(!BG_PRESETS[key]) key = 'studio';
    if(scene.background && scene.background.dispose) scene.background.dispose();
    scene.background = buildSkyTexture(key, dark);
    sceneState.bgPreset = key;
  }
  function setGroundColor(hex){
    if(!hex) hex = '#ffffff';
    ground.material.color.set(hex);
    sceneState.groundColor = hex;
  }
  function setGroundTexture(key){
    if(!GROUND_TEXTURES[key]) key = 'checker';
    ground.material.map = getGroundTexture(key);
    ground.material.needsUpdate = true;
    sceneState.groundTexture = key;
  }

  var ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ map: getGroundTexture('checker'), roughness: 0.95, metalness: 0, envMap: envMap })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  ground.userData.isGround = true;
  scene.add(ground);

  setBackgroundPreset('studio');

  // ---------------------------------------------------------------
  // Controls
  // ---------------------------------------------------------------
  var orbit = new THREE.OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.dampingFactor = 0.08;
  orbit.maxPolarAngle = Math.PI * 0.495;
  orbit.minDistance = 2;
  orbit.maxDistance = 40;
  orbit.target.set(DEFAULT_CAM.target[0], DEFAULT_CAM.target[1], DEFAULT_CAM.target[2]);

  var xform = new THREE.TransformControls(camera, renderer.domElement);
  xform.setSize(0.85);
  scene.add(xform);
  xform.addEventListener('dragging-changed', function(e){
    orbit.enabled = !e.value;
    if(e.value) beginChange(); else commitChange();
  });
  xform.addEventListener('objectChange', function(){
    if(selected === lightGizmo){ pointLight.position.copy(lightGizmo.position); }
  });

  // ---------------------------------------------------------------
  // Camera presets
  // ---------------------------------------------------------------
  var CAMERA_PRESETS = {
    front: { pos:[0, 3, 11],   target:[0, 1, 0] },
    top:   { pos:[0.01, 14, 0.01], target:[0, 0, 0] },
    side:  { pos:[11, 3, 0],   target:[0, 1, 0] },
    reset: { pos: DEFAULT_CAM.pos, target: DEFAULT_CAM.target }
  };
  function goToCamera(key){
    var p = CAMERA_PRESETS[key];
    if(!p) return;
    camera.position.set(p.pos[0], p.pos[1], p.pos[2]);
    orbit.target.set(p.target[0], p.target[1], p.target[2]);
    orbit.update();
  }
  document.getElementById('camFront').addEventListener('click', function(){ goToCamera('front'); });
  document.getElementById('camTop').addEventListener('click', function(){ goToCamera('top'); });
  document.getElementById('camSide').addEventListener('click', function(){ goToCamera('side'); });
  document.getElementById('camReset').addEventListener('click', function(){ goToCamera('reset'); });

  // ---------------------------------------------------------------
  // Materials / presets
  // ---------------------------------------------------------------
  var PRESETS = {
    matte:    { metalness: 0.0, roughness: 1.0,  transparent: false, opacity: 1.0 },
    metallic: { metalness: 1.0, roughness: 0.35, transparent: false, opacity: 1.0 },
    mirror:   { metalness: 1.0, roughness: 0.03, transparent: false, opacity: 1.0 },
    clear:    { metalness: 0.0, roughness: 0.04, transparent: true,  opacity: 0.32 }
  };
  var PRESET_ORDER = ['matte','metallic','mirror','clear'];
  var PRESET_LABEL = { matte:'Matte', metallic:'Metallic', mirror:'Mirror', clear:'Clear' };
  var PRESET_SWATCH = { matte:'#9aa1af', metallic:'#c9902f', mirror:'#e7ebf2', clear:'#bfe0e8' };

  function eachMaterial(root, fn){
    root.traverse(function(o){
      if(o.isMesh && o.material){
        var mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(fn);
      }
    });
  }

  function applyPreset(root, key){
    var p = PRESETS[key];
    if(!p) return;
    eachMaterial(root, function(m){
      m.metalness = p.metalness;
      m.roughness = p.roughness;
      m.transparent = p.transparent;
      m.opacity = p.opacity;
      m.depthWrite = !p.transparent;
      m.needsUpdate = true;
    });
    root.userData.preset = key;
    // Three.js shadow maps render every caster as a solid silhouette —
    // they don't look at opacity/transparency at all — so a see-through
    // "Clear" object was casting the same heavy dark shadow as a solid
    // matte one. There's no cheap way to make that shadow proportionally
    // lighter, so transparent presets simply stop casting a shadow.
    root.traverse(function(o){
      if(o.isMesh) o.castShadow = !p.transparent;
    });
    updateReflectionProbe(root);
  }

  function applyColor(root, hex){
    eachMaterial(root, function(m){ if(m.color) m.color.set(hex); });
    root.userData.color = hex;
  }

  function applyRoughness(root, v){
    eachMaterial(root, function(m){ if('roughness' in m){ m.roughness = v; } });
  }
  function applyMetalness(root, v){
    eachMaterial(root, function(m){ if('metalness' in m){ m.metalness = v; } });
  }
  function firstMaterial(root){
    var found = null;
    eachMaterial(root, function(m){ if(!found) found = m; });
    return found;
  }

  // ---------------------------------------------------------------
  // Per-object reflection probes: a metal/mirror object needs to see
  // everything around it EXCEPT itself, and should still show up in a
  // neighboring mirror's reflection. The single shared cubemap above
  // can't do that (it's one texture used by every material), so any
  // object reflective enough to notice gets its own small cubemap,
  // captured from its own position with only itself hidden. Non-metal
  // materials (matte, and low-Fresnel "Clear" glass) keep using the
  // cheap shared cubemap instead — they don't show a visible
  // self-reflection artifact, so a dedicated probe would be wasted cost.
  // ---------------------------------------------------------------
  var OWN_PROBE_SIZE = 128;
  function createOwnProbe(){
    var target = new THREE.WebGLCubeRenderTarget(OWN_PROBE_SIZE, {
      format: THREE.RGBAFormat,
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter
    });
    var probeCam = new THREE.CubeCamera(0.05, 60, target);
    scene.add(probeCam);
    return { cubeCamera: probeCam, target: target };
  }
  function disposeOwnProbe(root){
    if(root.userData.ownProbe){
      scene.remove(root.userData.ownProbe.cubeCamera);
      root.userData.ownProbe.target.dispose();
      delete root.userData.ownProbe;
    }
  }
  function updateReflectionProbe(root){
    var m = firstMaterial(root);
    var reflective = !!m && m.metalness >= 0.4;
    if(reflective){
      if(!root.userData.ownProbe) root.userData.ownProbe = createOwnProbe();
      eachMaterial(root, function(mat){ mat.envMap = root.userData.ownProbe.target.texture; mat.needsUpdate = true; });
    } else if(root.userData.ownProbe){
      disposeOwnProbe(root);
      eachMaterial(root, function(mat){ mat.envMap = envMap; mat.needsUpdate = true; });
    }
  }

  // ---------------------------------------------------------------
  // Object spawning
  // ---------------------------------------------------------------
  var objects = [];
  var spawnColors = ['#8fa3c7','#d99a5b','#7fb89a','#c07f9e','#9c8fd9','#c9b25b'];
  var spawnIndex = 0;
  var placedCount = 0;

  var SHAPE_DEFS = {
    box:      { make: function(){ return new THREE.BoxGeometry(1,1,1); },              halfHeight: 0.5,  label: 'Box' },
    sphere:   { make: function(){ return new THREE.SphereGeometry(0.6, 32, 24); },      halfHeight: 0.6,  label: 'Sphere' },
    cylinder: { make: function(){ return new THREE.CylinderGeometry(0.5, 0.5, 1.1, 28); }, halfHeight: 0.55, label: 'Cylinder' }
  };

  function nextSpawnColor(){
    var c = spawnColors[spawnIndex % spawnColors.length];
    spawnIndex++;
    return c;
  }

  function spawnPosition(){
    var angle = placedCount * 0.9;
    var radius = 1.1 + (placedCount % 4) * 0.55;
    return new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
  }

  function createPrimitive(type){
    var def = SHAPE_DEFS[type];
    if(!def) return null;
    var mat = new THREE.MeshStandardMaterial({ envMap: envMap });
    var mesh = new THREE.Mesh(def.make(), mat);
    mesh.userData.shapeType = type;
    return { mesh: mesh, halfHeight: def.halfHeight, label: def.label };
  }

  function finalizeShape(mesh, halfHeight, label, presetKey, colorHex){
    pushHistory();
    var pos = spawnPosition();
    mesh.position.set(pos.x, halfHeight, pos.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.selectable = true;
    mesh.userData.kind = 'shape';
    mesh.userData.label = label;
    applyPreset(mesh, presetKey || 'matte');
    applyColor(mesh, colorHex || nextSpawnColor());
    scene.add(mesh);
    objects.push(mesh);
    placedCount++;
    select(mesh);
    updateHud();
  }

  function addShape(type){
    var built = createPrimitive(type);
    if(!built) return;
    finalizeShape(built.mesh, built.halfHeight, built.label);
  }

  document.getElementById('addBox').addEventListener('click', function(){ addShape('box'); });
  document.getElementById('addSphere').addEventListener('click', function(){ addShape('sphere'); });
  document.getElementById('addCylinder').addEventListener('click', function(){ addShape('cylinder'); });

  // ---------------------------------------------------------------
  // Import (.glb / .gltf)
  // ---------------------------------------------------------------
  var fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var lower = file.name.toLowerCase();
    if(!lower.endsWith('.glb') && !lower.endsWith('.gltf')){
      showToast('Please choose a .glb or .gltf file.');
      fileInput.value = '';
      return;
    }
    var url = URL.createObjectURL(file);
    var loader = new THREE.GLTFLoader();
    showToast('Loading ' + file.name + '…');
    loader.load(url, function(gltf){
      var root = gltf.scene || gltf.scenes[0];
      var box = new THREE.Box3().setFromObject(root);
      var size = new THREE.Vector3(); box.getSize(size);
      var maxDim = Math.max(size.x, size.y, size.z) || 1;
      var scale = 1.5 / maxDim;
      root.scale.setScalar(scale);

      box.setFromObject(root);
      var center = new THREE.Vector3(); box.getCenter(center);
      var pos = spawnPosition();
      root.position.x = pos.x - center.x;
      root.position.z = pos.z - center.z;
      root.position.y -= box.min.y;

      root.traverse(function(o){
        if(o.isMesh){
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      root.userData.selectable = true;
      root.userData.kind = 'shape';
      root.userData.label = file.name.replace(/\.(glb|gltf)$/i,'');
      root.userData.imported = true;
      updateReflectionProbe(root);

      pushHistory();
      scene.add(root);
      objects.push(root);
      placedCount++;
      select(root);
      updateHud();
      URL.revokeObjectURL(url);
      showToast('Imported ' + root.userData.label);
    }, undefined, function(err){
      console.error(err);
      showToast('Could not load that file — make sure it’s a valid glTF/GLB model.');
      URL.revokeObjectURL(url);
    });
    fileInput.value = '';
  });

  // ---------------------------------------------------------------
  // Selection
  // ---------------------------------------------------------------
  var raycaster = new THREE.Raycaster();
  var pointerNdc = new THREE.Vector2();
  var selected = null;
  var pointerDown = null;
  var wasDragging = false;

  function findSelectableRoot(obj){
    var o = obj;
    while(o){
      if(o.userData && o.userData.selectable) return o;
      o = o.parent;
    }
    return null;
  }

  function raycastTargets(){
    return objects.concat([lightGizmo]);
  }

  canvas.addEventListener('pointerdown', function(e){
    pointerDown = { x: e.clientX, y: e.clientY };
  });

  canvas.addEventListener('pointerup', function(e){
    if(xform.dragging){ wasDragging = true; return; }
    if(wasDragging){ wasDragging = false; return; }
    if(!pointerDown) return;
    var dx = e.clientX - pointerDown.x, dy = e.clientY - pointerDown.y;
    pointerDown = null;
    if(Math.sqrt(dx*dx + dy*dy) > 5) return; // was a drag/orbit, not a click

    var rect = canvas.getBoundingClientRect();
    pointerNdc.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNdc.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointerNdc, camera);
    var hits = raycaster.intersectObjects(raycastTargets(), true);
    if(hits.length){
      var root = findSelectableRoot(hits[0].object);
      if(root) select(root); else deselect();
    } else {
      deselect();
    }
  });

  function select(obj){
    selected = obj;
    xform.attach(obj);
    renderInspector();
    renderOutliner();
  }
  function deselect(){
    selected = null;
    xform.detach();
    renderInspector();
    renderOutliner();
  }

  // ---------------------------------------------------------------
  // Transform mode
  // ---------------------------------------------------------------
  var modeButtons = {
    translate: document.getElementById('modeMove'),
    rotate: document.getElementById('modeRotate'),
    scale: document.getElementById('modeScale')
  };
  function setMode(mode){
    xform.setMode(mode);
    Object.keys(modeButtons).forEach(function(k){
      modeButtons[k].classList.toggle('active', k === mode);
    });
  }
  modeButtons.translate.addEventListener('click', function(){ setMode('translate'); });
  modeButtons.rotate.addEventListener('click', function(){ setMode('rotate'); });
  modeButtons.scale.addEventListener('click', function(){ setMode('scale'); });
  setMode('translate');

  document.getElementById('clearBtn').addEventListener('click', function(){
    if(!objects.length) return;
    pushHistory();
    objects.slice().forEach(function(o){ removeObject(o, true); });
  });

  function removeObject(obj, skipHistory){
    if(!skipHistory) pushHistory();
    if(selected === obj) deselect();
    disposeOwnProbe(obj);
    scene.remove(obj);
    eachMaterial(obj, function(m){ m.dispose(); });
    obj.traverse(function(o){ if(o.isMesh && o.geometry) o.geometry.dispose(); });
    var idx = objects.indexOf(obj);
    if(idx >= 0) objects.splice(idx, 1);
    updateHud();
  }

  // ---------------------------------------------------------------
  // Undo / redo history
  // ---------------------------------------------------------------
  var undoStack = [];
  var redoStack = [];
  var HISTORY_LIMIT = 60;
  var historyChanging = false;
  var historyPending = null;

  function captureSnapshot(){
    return {
      objects: objects.map(function(o){
        var m = firstMaterial(o);
        return {
          ref: o,
          pos: o.position.clone(),
          quat: o.quaternion.clone(),
          scale: o.scale.clone(),
          preset: o.userData.preset,
          color: o.userData.color,
          roughness: m ? m.roughness : undefined,
          metalness: m ? m.metalness : undefined
        };
      }),
      light: {
        pos: lightGizmo.position.clone(),
        color: pointLight.color.getHex(),
        intensity: pointLight.intensity
      },
      groundColor: sceneState.groundColor,
      groundTexture: sceneState.groundTexture,
      bgPreset: sceneState.bgPreset
    };
  }

  function restoreSnapshot(snap){
    objects.slice().forEach(function(o){
      var stillThere = snap.objects.some(function(s){ return s.ref === o; });
      if(!stillThere){
        if(selected === o) selected = null;
        scene.remove(o);
      }
    });
    objects.length = 0;
    snap.objects.forEach(function(s){
      if(s.ref.parent !== scene) scene.add(s.ref);
      s.ref.position.copy(s.pos);
      s.ref.quaternion.copy(s.quat);
      s.ref.scale.copy(s.scale);
      if(s.preset) applyPreset(s.ref, s.preset);
      if(s.color) applyColor(s.ref, s.color);
      if(typeof s.roughness === 'number') applyRoughness(s.ref, s.roughness);
      if(typeof s.metalness === 'number') applyMetalness(s.ref, s.metalness);
      updateReflectionProbe(s.ref);
      objects.push(s.ref);
    });

    lightGizmo.position.copy(snap.light.pos);
    pointLight.color.setHex(snap.light.color);
    pointLight.intensity = snap.light.intensity;
    bulbCore.material.color.setHex(snap.light.color);
    bulbGlow.material.color.setHex(snap.light.color);

    setGroundColor(snap.groundColor);
    setGroundTexture(snap.groundTexture);
    setBackgroundPreset(snap.bgPreset);

    if(selected && objects.indexOf(selected) === -1 && selected !== lightGizmo) selected = null;
    if(selected) xform.attach(selected); else xform.detach();
    renderInspector();
    renderOutliner();
    updateHud();
  }

  function pushHistory(){
    undoStack.push(captureSnapshot());
    if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack.length = 0;
    updateHistoryButtons();
  }

  function beginChange(){
    if(historyChanging) return;
    historyChanging = true;
    historyPending = captureSnapshot();
  }
  function commitChange(){
    if(!historyChanging) return;
    historyChanging = false;
    undoStack.push(historyPending);
    if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
    redoStack.length = 0;
    historyPending = null;
    updateHistoryButtons();
  }

  function undo(){
    if(!undoStack.length) return;
    var snap = undoStack.pop();
    redoStack.push(captureSnapshot());
    restoreSnapshot(snap);
    updateHistoryButtons();
  }
  function redo(){
    if(!redoStack.length) return;
    var snap = redoStack.pop();
    undoStack.push(captureSnapshot());
    restoreSnapshot(snap);
    updateHistoryButtons();
  }

  var undoBtn = document.getElementById('undoBtn');
  var redoBtn = document.getElementById('redoBtn');
  function updateHistoryButtons(){
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  function wireContinuous(el, onChange){
    el.addEventListener('input', function(e){
      beginChange();
      onChange(e);
    });
    el.addEventListener('change', function(e){
      onChange(e);
      commitChange();
    });
  }

  // ---------------------------------------------------------------
  // Save / Load (manual, browser local storage)
  // ---------------------------------------------------------------
  var STORAGE_KEY = 'lightbox-studio-scene-v1';

  function serializeScene(){
    var prims = [];
    var skipped = 0;
    objects.forEach(function(o){
      if(o.userData.imported){ skipped++; return; }
      var m = firstMaterial(o);
      prims.push({
        shapeType: o.userData.shapeType,
        label: o.userData.label,
        position: o.position.toArray(),
        quaternion: o.quaternion.toArray(),
        scale: o.scale.toArray(),
        preset: o.userData.preset,
        color: o.userData.color,
        roughness: m ? m.roughness : undefined,
        metalness: m ? m.metalness : undefined
      });
    });
    return {
      version: 1,
      objects: prims,
      skippedImports: skipped,
      placedCount: placedCount,
      light: {
        position: lightGizmo.position.toArray(),
        color: pointLight.color.getHex(),
        intensity: pointLight.intensity
      },
      ground: { color: sceneState.groundColor, texture: sceneState.groundTexture },
      background: sceneState.bgPreset
    };
  }

  function saveScene(){
    var data = serializeScene();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      var note = data.skippedImports ? (' (' + data.skippedImports + ' imported model' + (data.skippedImports > 1 ? 's' : '') + ' not included — only basic shapes are saved for now)') : '';
      showToast('Scene saved' + note + '.');
    } catch(err){
      console.error(err);
      showToast('Could not save — your browser blocked local storage.');
    }
  }

  function loadScene(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }
    catch(err){ raw = null; }
    if(!raw){ showToast('No saved scene found yet.'); return; }
    var data;
    try{ data = JSON.parse(raw); }
    catch(err){ showToast('Saved scene data looks corrupted.'); return; }

    pushHistory();

    objects.slice().forEach(function(o){ removeObject(o, true); });

    (data.objects || []).forEach(function(s){
      if(!SHAPE_DEFS[s.shapeType]) return;
      var built = createPrimitive(s.shapeType);
      var mesh = built.mesh;
      mesh.position.fromArray(s.position || [0, built.halfHeight, 0]);
      mesh.quaternion.fromArray(s.quaternion || [0,0,0,1]);
      mesh.scale.fromArray(s.scale || [1,1,1]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.selectable = true;
      mesh.userData.kind = 'shape';
      mesh.userData.label = s.label || built.label;
      applyPreset(mesh, s.preset || 'matte');
      applyColor(mesh, s.color || nextSpawnColor());
      if(typeof s.roughness === 'number') applyRoughness(mesh, s.roughness);
      if(typeof s.metalness === 'number') applyMetalness(mesh, s.metalness);
      updateReflectionProbe(mesh);
      scene.add(mesh);
      objects.push(mesh);
    });

    if(data.light){
      lightGizmo.position.fromArray(data.light.position || DEFAULT_LIGHT_POS);
      pointLight.color.setHex(data.light.color != null ? data.light.color : DEFAULT_LIGHT_COLOR);
      pointLight.intensity = typeof data.light.intensity === 'number' ? data.light.intensity : DEFAULT_LIGHT_INTENSITY;
      bulbCore.material.color.copy(pointLight.color);
      bulbGlow.material.color.copy(pointLight.color);
    }
    if(data.ground){
      setGroundColor(data.ground.color);
      var groundTexKey = data.ground.texture;
      if(!groundTexKey) groundTexKey = (data.ground.checker === false) ? 'plain' : 'checker';
      setGroundTexture(groundTexKey);
    }
    setBackgroundPreset(data.background);

    placedCount = typeof data.placedCount === 'number' ? data.placedCount : objects.length;
    deselect();
    updateHud();

    var note = data.skippedImports ? (' (' + data.skippedImports + ' imported model' + (data.skippedImports > 1 ? 's' : '') + ' from that save couldn’t be restored)') : '';
    showToast('Scene loaded' + note + '.');
  }

  document.getElementById('saveBtn').addEventListener('click', saveScene);
  document.getElementById('loadBtn').addEventListener('click', loadScene);

  // ---------------------------------------------------------------
  // Keyboard shortcuts
  // ---------------------------------------------------------------
  window.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;

    if((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){
      e.preventDefault(); undo(); return;
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y' || (e.shiftKey && (e.key === 'z' || e.key === 'Z')))){
      e.preventDefault(); redo(); return;
    }

    if(e.key === 'w' || e.key === 'W') setMode('translate');
    else if(e.key === 'e' || e.key === 'E') setMode('rotate');
    else if(e.key === 'r' || e.key === 'R') setMode('scale');
    else if((e.key === 'Delete' || e.key === 'Backspace') && selected && selected !== lightGizmo){
      e.preventDefault();
      removeObject(selected);
    } else if(e.key === 'Escape'){
      deselect();
    }
  });

  // ---------------------------------------------------------------
  // Inspector panel (shape / light / scene settings)
  // ---------------------------------------------------------------
  var inspector = document.getElementById('inspector');
  inspector.classList.add('open');

  function svgTrash(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>';
  }

  function renderInspector(){
    if(!selected){ renderScenePanel(); return; }

    if(selected.userData.kind === 'light'){
      inspector.innerHTML =
        '<div class="insp-head">' +
          '<div class="insp-title"><span class="panel-kind">Light source</span><span class="insp-name">Point light</span></div>' +
        '</div>' +
        '<hr class="sep">' +
        '<div>' +
          '<span class="field-label">Color</span>' +
          '<input type="color" id="lightColor" value="#' + pointLight.color.getHexString() + '">' +
        '</div>' +
        '<div class="slider-row">' +
          '<div class="row between"><span class="field-label" style="margin:0">Intensity</span><span class="val mono" id="lightIntVal"></span></div>' +
          '<input type="range" id="lightIntensity" min="0" max="8" step="0.1">' +
        '</div>' +
        '<div style="font-size:12px;color:var(--text-dim);line-height:1.5">Drag the glowing sphere in the scene to move the light around.</div>';

      wireContinuous(document.getElementById('lightColor'), function(e){
        pointLight.color.set(e.target.value);
        bulbCore.material.color.set(e.target.value);
        bulbGlow.material.color.set(e.target.value);
      });
      var intInput = document.getElementById('lightIntensity');
      var intVal = document.getElementById('lightIntVal');
      intInput.value = pointLight.intensity;
      intVal.textContent = pointLight.intensity.toFixed(1);
      wireContinuous(intInput, function(e){
        pointLight.intensity = parseFloat(e.target.value);
        intVal.textContent = pointLight.intensity.toFixed(1);
      });
      updateHud();
      return;
    }

    // shape
    var mat = firstMaterial(selected);
    var presetKey = selected.userData.preset || 'matte';
    var label = selected.userData.label || 'Shape';

    var presetsHtml = PRESET_ORDER.map(function(key){
      var sel = key === presetKey ? ' selected' : '';
      return '<button class="preset-btn' + sel + '" data-preset="' + key + '">' +
        '<span class="swatch" style="background:' + PRESET_SWATCH[key] + '"></span>' + PRESET_LABEL[key] +
        '</button>';
    }).join('');

    inspector.innerHTML =
      '<div class="insp-head">' +
        '<div class="insp-title"><span class="panel-kind">Selected shape</span><span class="insp-name">' + escapeHtml(label) + '</span></div>' +
        '<button class="iconbtn" id="deleteBtn" title="Delete">' + svgTrash() + '</button>' +
      '</div>' +
      '<hr class="sep">' +
      '<div>' +
        '<span class="field-label">Material</span>' +
        '<div class="presets">' + presetsHtml + '</div>' +
      '</div>' +
      '<div class="row between">' +
        '<span class="field-label" style="margin:0">Color</span>' +
        '<input type="color" id="shapeColor" value="' + (mat && mat.color ? '#' + mat.color.getHexString() : '#8fa3c7') + '">' +
      '</div>' +
      '<div class="slider-row">' +
        '<div class="row between"><span class="field-label" style="margin:0">Roughness</span><span class="val mono" id="roughVal"></span></div>' +
        '<input type="range" id="roughness" min="0" max="1" step="0.01">' +
      '</div>' +
      '<div class="slider-row">' +
        '<div class="row between"><span class="field-label" style="margin:0">Metalness</span><span class="val mono" id="metalVal"></span></div>' +
        '<input type="range" id="metalness" min="0" max="1" step="0.01">' +
      '</div>';

    document.getElementById('deleteBtn').addEventListener('click', function(){ removeObject(selected); });

    Array.prototype.forEach.call(inspector.querySelectorAll('.preset-btn'), function(btn){
      btn.addEventListener('click', function(){
        pushHistory();
        applyPreset(selected, btn.getAttribute('data-preset'));
        renderInspector();
      });
    });

    wireContinuous(document.getElementById('shapeColor'), function(e){
      applyColor(selected, e.target.value);
    });

    var roughInput = document.getElementById('roughness');
    var roughVal = document.getElementById('roughVal');
    var metalInput = document.getElementById('metalness');
    var metalVal = document.getElementById('metalVal');
    var m0 = firstMaterial(selected);
    roughInput.value = m0 ? m0.roughness : 1;
    metalInput.value = m0 ? m0.metalness : 0;
    roughVal.textContent = parseFloat(roughInput.value).toFixed(2);
    metalVal.textContent = parseFloat(metalInput.value).toFixed(2);
    wireContinuous(roughInput, function(e){
      applyRoughness(selected, parseFloat(e.target.value));
      roughVal.textContent = parseFloat(e.target.value).toFixed(2);
      updateReflectionProbe(selected);
    });
    wireContinuous(metalInput, function(e){
      applyMetalness(selected, parseFloat(e.target.value));
      metalVal.textContent = parseFloat(e.target.value).toFixed(2);
      updateReflectionProbe(selected);
    });

    updateHud();
  }

  function renderScenePanel(){
    var groundHtml = GROUND_ORDER.map(function(key){
      var g = GROUND_TEXTURES[key];
      var sel = key === sceneState.groundTexture ? ' selected' : '';
      return '<button class="preset-btn' + sel + '" data-ground="' + key + '">' +
        '<span class="swatch" style="background:' + g.swatch + '"></span>' + g.label +
        '</button>';
    }).join('');

    var bgHtml = BG_ORDER.map(function(key){
      var p = BG_PRESETS[key];
      var sel = key === sceneState.bgPreset ? ' selected' : '';
      return '<button class="preset-btn' + sel + '" data-bg="' + key + '">' +
        '<span class="swatch" style="background:' + p.swatch + '"></span>' + p.label +
        '</button>';
    }).join('');

    inspector.innerHTML =
      '<div class="insp-head">' +
        '<div class="insp-title"><span class="panel-kind">Nothing selected</span><span class="insp-name">Scene</span></div>' +
      '</div>' +
      '<hr class="sep">' +
      '<div>' +
        '<span class="field-label">Ground</span>' +
        '<div class="presets">' + groundHtml + '</div>' +
      '</div>' +
      '<div class="row between">' +
        '<span class="field-label" style="margin:0">Ground tint</span>' +
        '<input type="color" id="groundColor" value="' + sceneState.groundColor + '">' +
      '</div>' +
      '<div>' +
        '<span class="field-label">Backdrop</span>' +
        '<div class="presets">' + bgHtml + '</div>' +
      '</div>' +
      '<div style="font-size:12px;color:var(--text-dim);line-height:1.5">Click any shape or the light to edit it here.</div>';

    wireContinuous(document.getElementById('groundColor'), function(e){
      setGroundColor(e.target.value);
    });

    Array.prototype.forEach.call(inspector.querySelectorAll('[data-ground]'), function(btn){
      btn.addEventListener('click', function(){
        pushHistory();
        setGroundTexture(btn.getAttribute('data-ground'));
        renderScenePanel();
      });
    });

    Array.prototype.forEach.call(inspector.querySelectorAll('[data-bg]'), function(btn){
      btn.addEventListener('click', function(){
        pushHistory();
        setBackgroundPreset(btn.getAttribute('data-bg'));
        renderScenePanel();
      });
    });

    updateHud();
  }

  // ---------------------------------------------------------------
  // Object list (outliner)
  // ---------------------------------------------------------------
  var outlinerEl = document.getElementById('outliner');
  var outlinerListEl = document.getElementById('outlinerList');
  var toggleOutlinerBtn = document.getElementById('toggleOutliner');

  function setOutlinerOpen(open){
    outlinerEl.classList.toggle('open', open);
    toggleOutlinerBtn.classList.toggle('active', open);
  }
  setOutlinerOpen(window.innerWidth > 680);
  toggleOutlinerBtn.addEventListener('click', function(){
    setOutlinerOpen(!outlinerEl.classList.contains('open'));
  });

  function outlinerRowHtml(idx, name, color, removable, isSelected){
    return '<div class="outliner-row' + (isSelected ? ' selected' : '') + '" data-idx="' + idx + '">' +
      '<span class="dot2" style="background:' + color + '"></span>' +
      '<span class="name">' + escapeHtml(name) + '</span>' +
      (removable ? '<button class="rm" data-idx="' + idx + '" title="Delete">' + svgTrash() + '</button>' : '') +
      '</div>';
  }

  function renderOutliner(){
    var rows = [];
    rows.push(outlinerRowHtml(-1, 'Light', '#' + pointLight.color.getHexString(), false, selected === lightGizmo));
    objects.forEach(function(o, i){
      rows.push(outlinerRowHtml(i, o.userData.label || 'Shape', o.userData.color || '#8fa3c7', true, selected === o));
    });
    outlinerListEl.innerHTML = rows.join('');

    Array.prototype.forEach.call(outlinerListEl.querySelectorAll('.outliner-row'), function(row){
      row.addEventListener('click', function(e){
        if(e.target.closest('.rm')) return;
        var idx = parseInt(row.getAttribute('data-idx'), 10);
        select(idx === -1 ? lightGizmo : objects[idx]);
      });
    });
    Array.prototype.forEach.call(outlinerListEl.querySelectorAll('.rm'), function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        if(idx >= 0 && objects[idx]) removeObject(objects[idx]);
      });
    });
  }

  // ---------------------------------------------------------------
  // HUD + toast
  // ---------------------------------------------------------------
  var objCountEl = document.getElementById('objCount');
  var selPillEl = document.getElementById('selPill');
  var selNameEl = document.getElementById('selName');

  function updateHud(){
    objCountEl.textContent = objects.length;
    if(selected){
      selPillEl.style.display = '';
      selNameEl.textContent = selected.userData.kind === 'light' ? 'Light' : (selected.userData.label || 'Shape');
    } else {
      selPillEl.style.display = 'none';
    }
    renderOutliner();
  }

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2600);
  }

  // ---------------------------------------------------------------
  // Render loop
  // ---------------------------------------------------------------
  var envFrame = 0;
  var probeCursor = 0;
  var probeWorldPos = new THREE.Vector3();
  function tick(){
    orbit.update();
    pointLight.position.copy(lightGizmo.position);
    scene.updateMatrixWorld();

    var gizmoWasVisible = xform.visible;
    xform.visible = false;

    // Shared cubemap: used by the ground and any non-metal material
    // (matte, and low-Fresnel "Clear" glass). Nothing that relies on it
    // reflects itself noticeably, so it needs no per-object hiding.
    envFrame = (envFrame + 1) % 2;
    if(envFrame === 0){
      cubeCamera.update(renderer, scene);
    }

    // Per-object probes: update a couple of them per frame, round-robin,
    // so mirror/metal objects reflect their surroundings — including
    // each other — live, without paying the cost of every probe every
    // frame. Each object is hidden only for its OWN capture, so it never
    // reflects itself but still shows up correctly in everyone else's.
    var reflective = objects.filter(function(o){ return !!o.userData.ownProbe; });
    if(reflective.length){
      var perFrame = 2;
      for(var i=0; i<perFrame && i<reflective.length; i++){
        var obj = reflective[probeCursor % reflective.length];
        probeCursor++;
        var probe = obj.userData.ownProbe;
        var wasVisible = obj.visible;
        obj.visible = false;
        obj.getWorldPosition(probeWorldPos);
        probe.cubeCamera.position.copy(probeWorldPos);
        probe.cubeCamera.update(renderer, scene);
        obj.visible = wasVisible;
      }
    }

    xform.visible = gizmoWasVisible;

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  renderScenePanel();
  updateHistoryButtons();
  updateHud();
})();
</script>
