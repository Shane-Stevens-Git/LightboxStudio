<title>Lightbox Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f4;
    --panel:#ffffff;
    --panel-border:#dde1e8;
    --text:#14171c;
    --text-dim:#5c6270;
    --accent:#dd8a1f;
    --accent-ink:#1c1200;
    --danger:#c84343;
    --canvas-fallback:#c9d2de;
    /* Kept in sync with the real, measured height of #toolbar by JS --
       the toolbar wraps to more than one row once enough tool groups
       don't fit on a line (adding shapes/lights grows it over time), and
       a hardcoded offset here would let a wrapped second row sit under
       the floating panels instead of pushing them down. */
    --toolbar-h: 56px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1015;
      --panel:#181b22;
      --panel-border:#2a2e38;
      --text:#eef0f4;
      --text-dim:#9aa1af;
      --accent:#f0a53a;
      --accent-ink:#1c1200;
      --danger:#e46f6f;
      --canvas-fallback:#11141a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1015;
    --panel:#181b22;
    --panel-border:#2a2e38;
    --text:#eef0f4;
    --text-dim:#9aa1af;
    --accent:#f0a53a;
    --accent-ink:#1c1200;
    --danger:#e46f6f;
    --canvas-fallback:#11141a;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #viewport{
    position:fixed; inset:0;
    background:var(--canvas-fallback);
    touch-action:none;
  }
  #viewport canvas{ display:block; width:100%; height:100%; }

  /* ---------- Top toolbar ---------- */
  #toolbar{
    position:fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left:14px;
    right:14px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    z-index:20;
    pointer-events:none;
  }
  .toolgroup{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:4px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:5px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    overflow-x:auto;
    max-width:100%;
  }
  .brand{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
    padding:8px 12px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    white-space:nowrap;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
    flex:none;
  }
  .spacer{ flex:1 1 auto; min-width:8px; }

  button.tbtn{
    display:flex; align-items:center; gap:6px;
    background:transparent;
    border:1px solid transparent;
    color:var(--text);
    font:inherit;
    font-size:13px;
    font-weight:600;
    padding:7px 11px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  button.tbtn:hover{ background:var(--bg); }
  button.tbtn:active{ transform:translateY(1px); }
  button.tbtn.active{
    background:var(--accent);
    color:var(--accent-ink);
  }
  button.tbtn:disabled{ opacity:.35; cursor:default; }
  button.tbtn:disabled:hover{ background:transparent; }
  button.tbtn.iconOnly{ padding:7px; }
  button.tbtn svg{ width:16px; height:16px; flex:none; }

  button.tbtn.danger{ color:var(--danger); }
  button.tbtn.danger:hover{ background:color-mix(in srgb, var(--danger) 14%, transparent); }

  /* ---------- Floating panels (inspector + outliner) ---------- */
  #inspector, #outliner{
    position:fixed;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,.14);
    z-index:20;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    transition:transform .18s ease;
  }
  #inspector{
    top: calc(var(--toolbar-h) + 14px + env(safe-area-inset-top, 0px));
    right:14px;
    width:270px;
    max-width:calc(100vw - 28px);
    max-height: calc(100vh - var(--toolbar-h) - 42px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y:auto;
    transform:translateX(calc(100% + 28px));
  }
  #inspector.open{ transform:translateX(0); }

  #outliner{
    top: calc(var(--toolbar-h) + 14px + env(safe-area-inset-top, 0px));
    left:14px;
    width:210px;
    max-width:calc(100vw - 28px);
    max-height:min(46vh, 380px);
    padding:12px;
    gap:8px;
    transform:translateX(calc(-100% - 28px));
  }
  #outliner.open{ transform:translateX(0); }
  #outlinerList{ overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin:-2px; padding:2px; }

  .panel-kind{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--text-dim); font-weight:600;
  }

  .insp-head{
    display:flex; align-items:center; justify-content:space-between;
  }
  .insp-title{
    display:flex; flex-direction:column; gap:2px;
  }
  .insp-name{ font-size:16px; font-weight:700; }
  .iconbtn{
    background:transparent; border:1px solid var(--panel-border);
    border-radius:8px; width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:pointer; flex:none;
  }
  .iconbtn:hover{ color:var(--danger); border-color:var(--danger); }
  .iconbtn svg{ width:15px; height:15px; }

  .field-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--text-dim); font-weight:600; margin-bottom:7px; display:block;
  }

  .presets{
    display:grid; grid-template-columns:1fr 1fr; gap:7px;
  }
  .preset-btn{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px;
    border-radius:9px;
    border:1px solid var(--panel-border);
    background:var(--bg);
    color:var(--text);
    font:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer;
  }
  .preset-btn .swatch{
    width:15px; height:15px; border-radius:50%;
    flex:none; border:1px solid rgba(0,0,0,.15);
  }
  .preset-btn.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent) inset;
    background:color-mix(in srgb, var(--accent) 12%, var(--bg));
  }

  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }

  input[type="color"]{
    -webkit-appearance:none; appearance:none;
    width:34px; height:28px; border:1px solid var(--panel-border);
    border-radius:7px; padding:0; background:none; cursor:pointer; flex:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{ padding:2px; }
  input[type="color"]::-webkit-color-swatch{ border-radius:5px; border:none; }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px; border-radius:2px;
    background:var(--panel-border); outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:15px; height:15px; border-radius:50%;
    background:var(--accent); cursor:pointer;
    border:2px solid var(--panel);
    box-shadow:0 0 0 1px var(--accent);
  }
  input[type="range"]::-moz-range-thumb{
    width:15px; height:15px; border-radius:50%;
    background:var(--accent); cursor:pointer; border:2px solid var(--panel);
  }

  .slider-row{ display:flex; flex-direction:column; gap:6px; }
  .slider-row .row.between{ font-size:11.5px; }
  .slider-row .val{ color:var(--text-dim); }

  .xyz-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  input.xyz-input{
    width:100%; min-width:0;
    background:var(--bg); border:1px solid var(--panel-border); border-radius:7px;
    color:var(--text); font-size:12px; padding:5px 4px; text-align:center;
  }
  input.xyz-input:focus{ outline:none; border-color:var(--accent); }
  input.xyz-input::-webkit-inner-spin-button{ opacity:0.5; }

  .name-edit{
    flex:1; min-width:0; background:var(--panel); border:1px solid var(--accent);
    border-radius:6px; color:var(--text); font:inherit; font-size:13px; font-weight:600;
    padding:1px 4px;
  }

  hr.sep{ border:none; border-top:1px solid var(--panel-border); margin:2px 0; }

  .toggle-btn{
    display:flex; align-items:center; justify-content:space-between;
    width:100%;
    padding:8px 10px;
    border-radius:9px;
    border:1px solid var(--panel-border);
    background:var(--bg);
    color:var(--text);
    font:inherit; font-size:12.5px; font-weight:600;
    cursor:pointer;
  }
  .toggle-btn .pip{
    width:32px; height:18px; border-radius:999px;
    background:var(--panel-border); position:relative; flex:none;
    transition:background .12s ease;
  }
  .toggle-btn .pip::after{
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px;
    border-radius:50%; background:var(--panel); transition:left .12s ease;
  }
  .toggle-btn.on .pip{ background:var(--accent); }
  .toggle-btn.on .pip::after{ left:16px; }

  .outliner-row{
    display:flex; align-items:center; gap:8px; padding:7px 8px; border-radius:8px;
    cursor:pointer; font-size:13px; font-weight:600;
  }
  .outliner-row:hover{ background:var(--bg); }
  .outliner-row.selected{ background:color-mix(in srgb, var(--accent) 16%, var(--bg)); }
  .outliner-row.multiselected{ background:color-mix(in srgb, var(--accent) 9%, var(--bg)); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent) inset; }
  .outliner-row .dot2{ width:9px; height:9px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.15); }
  .outliner-row .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .outliner-row .rm{
    opacity:0; background:none; border:none; color:var(--text-dim); cursor:pointer;
    padding:2px; display:flex; flex:none;
  }
  .outliner-row:hover .rm{ opacity:1; }
  .outliner-row .rm:hover{ color:var(--danger); }
  .outliner-row .rm svg{ width:13px; height:13px; }
  .outliner-empty{ font-size:12px; color:var(--text-dim); padding:6px 2px; }

  /* ---------- Bottom HUD ---------- */
  #hud{
    position:fixed;
    left:14px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index:20;
    display:flex; flex-direction:column; gap:6px;
    max-width:calc(100vw - 28px);
  }
  #hud .pill{
    pointer-events:auto;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:999px;
    padding:7px 13px;
    font-size:12px;
    color:var(--text-dim);
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    display:flex; align-items:center; gap:8px;
    width:fit-content;
  }
  #hud .pill b{ color:var(--text); font-weight:700; }
  #hud .hint{ display:none; }
  @media (min-width:640px){
    #hud .hint{ display:flex; }
  }

  /* ---------- Toast ---------- */
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  #toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%,12px);
    background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600;
    z-index:40; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    max-width:calc(100vw - 40px); text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #fileInput{ display:none; }

  .dropdown-menu{
    position:absolute; top:calc(100% + 6px); left:0;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.16); padding:6px; min-width:172px; z-index:30;
    display:none; flex-direction:column; gap:2px;
  }
  .dropdown-menu.open{ display:flex; }
  .dropdown-menu button{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    font:inherit; font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:7px; cursor:pointer;
  }
  .dropdown-menu button:hover{ background:var(--bg); }

  @media (max-width:680px){
    #inspector{
      left:14px; right:14px; width:auto; max-width:none;
      top:auto;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      max-height: calc(72vh - env(safe-area-inset-bottom, 0px));
      transform:translateY(calc(100% + 28px));
    }
    #inspector.open{ transform:translateY(0); }
    #outliner{
      left:14px; right:14px; width:auto; max-width:none;
    }
    #hud{ bottom: auto; top: calc(var(--toolbar-h) + 14px + env(safe-area-inset-top, 0px)); }
  }
</style>

<div id="viewport"><canvas id="c"></canvas></div>

<div id="toolbar">
  <div class="brand"><span class="dot"></span>Lightbox Studio</div>

  <div class="toolgroup" id="addGroup">
    <button class="tbtn" id="addBox" title="Add a box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg>
      Box
    </button>
    <button class="tbtn" id="addSphere" title="Add a sphere">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12c3 2.5 15 2.5 18 0"/><path d="M12 3c2.5 3 2.5 15 0 18"/></svg>
      Sphere
    </button>
    <button class="tbtn" id="addCylinder" title="Add a cylinder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3v-13"/></svg>
      Cylinder
    </button>
    <button class="tbtn" id="addCone" title="Add a cone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="19" rx="7.5" ry="2.5"/><path d="M12 3 4.5 19"/><path d="M12 3l7.5 16"/></svg>
      Cone
    </button>
    <button class="tbtn" id="addTorus" title="Add a torus">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="9" ry="5"/><ellipse cx="12" cy="12" rx="3.3" ry="1.8"/></svg>
      Torus
    </button>
    <button class="tbtn" id="addCapsule" title="Add a capsule">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="5"/></svg>
      Capsule
    </button>
    <button class="tbtn" id="importBtn" title="Import a .glb / .gltf model">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      Import
    </button>
    <input type="file" id="fileInput" accept=".glb,.gltf">
  </div>

  <div class="toolgroup" id="lightGroup">
    <button class="tbtn" id="addPointLight" title="Add a point light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.15 1 1.9V16h5v-.2c0-.75.4-1.45 1-1.9A6 6 0 0 0 12 3Z"/></svg>
      Light
    </button>
    <button class="tbtn" id="addSunLight" title="Add a sun (directional) light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      Sun
    </button>
  </div>

  <div class="toolgroup" id="modeGroup">
    <button class="tbtn" id="modeMove" title="Move (W)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v20M2 12h20"/><path d="M5 9l-3 3 3 3M19 9l3 3-3 3M9 5l3-3 3 3M9 19l3 3 3-3"/></svg>
      Move
    </button>
    <button class="tbtn" id="modeRotate" title="Rotate (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
      Rotate
    </button>
    <button class="tbtn" id="modeScale" title="Scale (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15v5h5M20 9V4h-5M20 4 13 11M4 20l7-7"/></svg>
      Scale
    </button>
    <button class="tbtn iconOnly" id="snapToggle" title="Snap to grid/angle (hold Shift while dragging to invert)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
  </div>

  <div class="toolgroup">
    <button class="tbtn iconOnly" id="undoBtn" title="Undo (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7 4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
    </button>
    <button class="tbtn iconOnly" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg>
    </button>
  </div>

  <div class="toolgroup">
    <button class="tbtn iconOnly" id="saveBtn" title="Save scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5V4Z"/><path d="M8 4v5h7V4"/><path d="M8 14h8v6H8z"/></svg>
    </button>
    <button class="tbtn iconOnly" id="loadBtn" title="Load saved scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10H3V7Z"/></svg>
    </button>
    <button class="tbtn iconOnly" id="exportRtBtn" title="Export for Ray Tracer (scene.json)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
    </button>
    <button class="tbtn iconOnly" id="exportJsonBtn" title="Export scene as a .json file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    </button>
    <button class="tbtn iconOnly" id="importJsonBtn" title="Import scene from a .json file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    </button>
    <input type="file" id="sceneFileInput" accept=".json" style="display:none">
  </div>

  <div class="toolgroup" id="templatesGroup" style="position:relative">
    <button class="tbtn" id="templatesBtn" title="Load a starter scene">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
      Templates
    </button>
    <div id="templatesMenu" class="dropdown-menu"></div>
  </div>

  <div class="toolgroup">
    <button class="tbtn iconOnly" id="camFront" title="Front view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="tbtn iconOnly" id="camTop" title="Top view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16"/></svg>
    </button>
    <button class="tbtn iconOnly" id="camSide" title="Side view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16"/></svg>
    </button>
    <button class="tbtn iconOnly" id="camReset" title="Reset camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="tbtn iconOnly" id="camFrame" title="Frame selected (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><circle cx="12" cy="12" r="3.2"/></svg>
    </button>
  </div>

  <div class="spacer"></div>

  <div class="toolgroup">
    <button class="tbtn iconOnly active" id="toggleOutliner" title="Show/hide scene list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
  </div>

  <div class="toolgroup">
    <button class="tbtn danger" id="clearBtn" title="Remove all placed shapes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>
      Clear
    </button>
  </div>
</div>

<div id="outliner">
  <div class="panel-kind">Scene</div>
  <div id="outlinerList"></div>
</div>

<div id="inspector">
  <!-- populated by JS -->
</div>

<div id="hud">
  <div class="pill"><b id="objCount">0</b>&nbsp;objects <span id="selPill" style="display:none">· <b id="selName"></b> selected</span></div>
  <div class="pill hint">Click a shape to select · drag the gizmo to move it · <span class="mono">W</span>/<span class="mono">E</span>/<span class="mono">R</span> to switch mode · <span class="mono">Del</span> to remove · <span class="mono">Ctrl</span>+<span class="mono">Z</span> to undo</div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.137.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
(function(){
  "use strict";

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // The toolbar wraps onto more than one row once its tool groups no
  // longer fit on a line -- more likely now that it has quite a few
  // groups (shapes, lights, transform modes, history, save/export, camera
  // views...). #inspector/#outliner/#hud position themselves below it via
  // the --toolbar-h custom property, kept in sync with the toolbar's real
  // rendered height here so a wrapped second row never ends up hidden
  // under those floating panels.
  var toolbarEl = document.getElementById('toolbar');
  function syncToolbarHeight(){
    if(!toolbarEl) return;
    document.documentElement.style.setProperty('--toolbar-h', toolbarEl.offsetHeight + 'px');
  }
  window.addEventListener('resize', syncToolbarHeight);
  window.addEventListener('load', syncToolbarHeight);
  setTimeout(syncToolbarHeight, 0);

  // ---------------------------------------------------------------
  // Theme
  // ---------------------------------------------------------------
  function prefersDark(){
    var stamp = document.documentElement.getAttribute('data-theme');
    if(stamp === 'dark') return true;
    if(stamp === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  // ---------------------------------------------------------------
  // Renderer / scene / camera
  // ---------------------------------------------------------------
  var canvas = document.getElementById('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var dark = prefersDark();

  var DEFAULT_CAM = { pos:[7, 5.5, 8], target:[0, 0.8, 0] };
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  camera.position.set(DEFAULT_CAM.pos[0], DEFAULT_CAM.pos[1], DEFAULT_CAM.pos[2]);

  // ---------------------------------------------------------------
  // Post-processing (bloom glow). The composer always exists; whether a
  // frame actually goes through it is gated by bloomPass.enabled so the
  // plain renderer.render() path (cheaper, and identical output) is used
  // whenever bloom is off.
  // ---------------------------------------------------------------
  var composer = new THREE.EffectComposer(renderer);
  var renderPass = new THREE.RenderPass(scene, camera);
  composer.addPass(renderPass);
  var bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.4, 0.85);
  bloomPass.enabled = false;
  composer.addPass(bloomPass);

  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------
  // Live reflection cubemap: a camera parked at the center of the
  // sandbox re-renders the REAL scene (ground, shapes, the light) into a
  // cubemap every few frames. Every material's envMap points at that same
  // texture, so mirror/metal surfaces reflect what's actually around them
  // right now, and the reflection updates as shapes are added or moved.
  // ---------------------------------------------------------------
  var cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256, {
    format: THREE.RGBAFormat,
    generateMipmaps: true,
    minFilter: THREE.LinearMipmapLinearFilter
  });
  var envMap = cubeRenderTarget.texture;
  var cubeCamera = new THREE.CubeCamera(0.1, 60, cubeRenderTarget);
  cubeCamera.position.set(0, 1.2, 0);
  scene.add(cubeCamera);

  // ---------------------------------------------------------------
  // Lights
  // ---------------------------------------------------------------
  var hemi = new THREE.HemisphereLight(dark ? 0x2b3550 : 0xdfe8f5, dark ? 0x15130f : 0xcbbfa8, 0.55);
  scene.add(hemi);

  var DEFAULT_LIGHT_POS = [3.5, 4.5, 2.5];
  var DEFAULT_LIGHT_COLOR = 0xfff1d8;
  var DEFAULT_LIGHT_INTENSITY = 2.4;

  // A light source in this sandbox is two things kept in sync: a real
  // THREE.Light that actually illuminates the scene, and a small glowing
  // gizmo the user can see, select and drag. Point lights and the
  // directional "Sun" light share this same pattern, so both can be
  // added, selected, moved, colored and deleted just like any shape.
  var LIGHT_TYPES = {
    point: {
      label: 'Point Light',
      defaultColor: 0xfff1d8,
      defaultIntensity: 2.4,
      intensityMax: 8,
      make: function(){
        var light = new THREE.PointLight(0xffffff, 1, 0, 2);
        light.castShadow = true;
        light.shadow.mapSize.set(1024, 1024);
        light.shadow.camera.near = 0.5;
        light.shadow.camera.far = 30;
        light.shadow.bias = -0.002;
        return light;
      },
      makeGizmo: function(){
        var color = 0xffb454;
        var g = new THREE.Group();
        var core = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 16), new THREE.MeshBasicMaterial({ color: color }));
        var glow = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 16), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.22, depthWrite: false }));
        g.add(core, glow);
        g.userData.core = core;
        g.userData.glow = glow;
        return g;
      }
    },
    sun: {
      label: 'Sun',
      defaultColor: 0xfff4e0,
      defaultIntensity: 1.4,
      intensityMax: 4,
      make: function(){
        // Direction comes from the light's own position pointing at a
        // fixed target parked at the world origin — dragging the "sun"
        // gizmo around is what changes the angle it shines from.
        var light = new THREE.DirectionalLight(0xffffff, 1);
        light.castShadow = true;
        light.shadow.mapSize.set(1024, 1024);
        light.shadow.camera.near = 1;
        light.shadow.camera.far = 40;
        light.shadow.camera.left = -12;
        light.shadow.camera.right = 12;
        light.shadow.camera.top = 12;
        light.shadow.camera.bottom = -12;
        light.shadow.bias = -0.0015;
        light.target.position.set(0, 0, 0);
        return light;
      },
      makeGizmo: function(){
        var color = 0xffe9a8;
        var g = new THREE.Group();
        var core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), new THREE.MeshBasicMaterial({ color: color }));
        var glow = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 16), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.16, depthWrite: false }));
        g.add(core, glow);
        g.userData.core = core;
        g.userData.glow = glow;
        return g;
      }
    }
  };

  var lights = [];
  var lightSpawnIndex = 0;

  function spawnLightPosition(){
    var angle = lightSpawnIndex * 1.4 + 0.6;
    var radius = 4 + (lightSpawnIndex % 3) * 1.4;
    return new THREE.Vector3(Math.cos(angle) * radius, 3.5 + (lightSpawnIndex % 2) * 1.2, Math.sin(angle) * radius);
  }

  function syncLightTransform(gizmo){
    gizmo.userData.lightObj.position.copy(gizmo.position);
  }

  function addLight(type, position, color, intensity){
    var def = LIGHT_TYPES[type];
    if(!def) return null;
    var lightObj = def.make();
    var gizmo = def.makeGizmo();
    gizmo.position.copy(position || spawnLightPosition());
    gizmo.userData.selectable = true;
    gizmo.userData.kind = 'light';
    gizmo.userData.lightType = type;
    gizmo.userData.lightObj = lightObj;
    gizmo.userData.label = def.label;

    var col = color != null ? color : def.defaultColor;
    var inten = intensity != null ? intensity : def.defaultIntensity;
    lightObj.color.setHex(col);
    lightObj.intensity = inten;
    // sceneState is declared further down (in the Ground/background section)
    // but this function's very first call happens during initial setup,
    // before that line runs -- typeof-guard so that earliest call (which
    // just wants the plain default) doesn't throw on a not-yet-assigned var.
    if(lightObj.shadow) lightObj.shadow.radius = (typeof sceneState !== 'undefined' && sceneState.shadowSoftness != null) ? sceneState.shadowSoftness : 1;
    gizmo.userData.core.material.color.setHex(col);
    gizmo.userData.glow.material.color.setHex(col);

    syncLightTransform(gizmo);
    scene.add(gizmo);
    scene.add(lightObj);
    if(type === 'sun') scene.add(lightObj.target);

    lights.push(gizmo);
    lightSpawnIndex++;
    return gizmo;
  }

  function addLightAndSelect(type){
    pushHistory();
    var gizmo = addLight(type);
    select(gizmo);
    updateHud();
  }

  function removeLight(gizmo, skipHistory){
    if(!skipHistory) pushHistory();
    if(selected === gizmo) deselect();
    var mi = multiSelected.indexOf(gizmo);
    if(mi >= 0) multiSelected.splice(mi, 1);
    scene.remove(gizmo);
    scene.remove(gizmo.userData.lightObj);
    if(gizmo.userData.lightType === 'sun') scene.remove(gizmo.userData.lightObj.target);
    gizmo.userData.core.material.dispose();
    gizmo.userData.core.geometry.dispose();
    gizmo.userData.glow.material.dispose();
    gizmo.userData.glow.geometry.dispose();
    if(gizmo.userData.lightObj.shadow && gizmo.userData.lightObj.shadow.map){
      gizmo.userData.lightObj.shadow.map.dispose();
    }
    var idx = lights.indexOf(gizmo);
    if(idx >= 0) lights.splice(idx, 1);
    updateHud();
  }

  addLight('point', new THREE.Vector3(DEFAULT_LIGHT_POS[0], DEFAULT_LIGHT_POS[1], DEFAULT_LIGHT_POS[2]), DEFAULT_LIGHT_COLOR, DEFAULT_LIGHT_INTENSITY);

  // ---------------------------------------------------------------
  // Ground + background (Scene settings)
  // ---------------------------------------------------------------
  function checkerTexture(isDark){
    var size = 256;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var a = isDark ? '#20242e' : '#e7eaf0';
    var b = isDark ? '#262b37' : '#dde1ea';
    var cells = 8, cell = size / cells;
    for(var i=0;i<cells;i++){
      for(var j=0;j<cells;j++){
        ctx.fillStyle = ((i+j)%2===0) ? a : b;
        ctx.fillRect(i*cell, j*cell, cell, cell);
      }
    }
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(10,10);
    tex.anisotropy = 4;
    return tex;
  }

  // Draws an ellipse speckle plus wrapped copies near the canvas edges so
  // the tiled ground textures below don't show a hard seam at the repeat.
  function drawSpeckle(ctx, size, x, y, r, ry, col){
    var xs = [x];
    if(x < r) xs.push(x + size);
    if(x > size - r) xs.push(x - size);
    var ys = [y];
    if(y < ry) ys.push(y + size);
    if(y > size - ry) ys.push(y - size);
    ctx.fillStyle = col;
    xs.forEach(function(xx){
      ys.forEach(function(yy){
        ctx.beginPath();
        ctx.ellipse(xx, yy, r, ry, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    });
  }

  function noiseGroundTexture(colorSet, isDark, opts){
    var size = 256;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var colors = isDark ? colorSet.dark : colorSet.light;
    ctx.fillStyle = colors[0];
    ctx.fillRect(0, 0, size, size);
    ctx.globalAlpha = opts.alpha != null ? opts.alpha : 0.5;
    for(var i=0;i<opts.speckles;i++){
      var col = colors[1 + Math.floor(Math.random() * (colors.length - 1))];
      var x = Math.random() * size, y = Math.random() * size;
      var r = opts.minR + Math.random() * (opts.maxR - opts.minR);
      var ry = r * (0.6 + Math.random() * 0.5);
      drawSpeckle(ctx, size, x, y, r, ry, col);
    }
    ctx.globalAlpha = 1;
    var tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(opts.repeat || 9, opts.repeat || 9);
    tex.anisotropy = 4;
    return tex;
  }

  var GROUND_TEXTURES = {
    plain:   { label:'Plain',   swatch:'#c7cbd2', build: function(){ return null; } },
    checker: { label:'Checker', swatch:'#cfd6e0', build: function(isDark){ return checkerTexture(isDark); } },
    dirt:    { label:'Dirt',    swatch:'#8a5a3c', build: function(isDark){
      return noiseGroundTexture({
        light: ['#93613f','#7f5334','#a4754c','#8f6541'],
        dark:  ['#3c2818','#332012','#472f1c','#3a2716']
      }, isDark, { speckles: 1100, minR: 2, maxR: 6.5, alpha: 0.5, repeat: 9 });
    } },
    grass:   { label:'Grass',   swatch:'#5f9a52', build: function(isDark){
      return noiseGroundTexture({
        light: ['#5f9a52','#6fae5f','#4f8a46','#7cb86a'],
        dark:  ['#20361c','#2a4522','#193014','#33542a']
      }, isDark, { speckles: 1500, minR: 1.5, maxR: 4, alpha: 0.55, repeat: 9 });
    } },
    cement:  { label:'Cement',  swatch:'#a9adb3', build: function(isDark){
      return noiseGroundTexture({
        light: ['#b7bac0','#aeb2b8','#c3c6cb','#a5a8ae'],
        dark:  ['#35373b','#2e3033','#3c3e42','#292b2e']
      }, isDark, { speckles: 1200, minR: 1, maxR: 5, alpha: 0.28, repeat: 7 });
    } }
  };
  var GROUND_ORDER = ['plain','checker','dirt','grass','cement'];
  var groundTextureCache = {};
  function getGroundTexture(key){
    if(!GROUND_TEXTURES[key]) key = 'checker';
    if(key === 'plain') return null;
    if(!groundTextureCache[key]) groundTextureCache[key] = GROUND_TEXTURES[key].build(dark);
    return groundTextureCache[key];
  }

  var BG_PRESETS = {
    studio:   { label:'Studio',    swatch:'#dfe8f5', top:'#dfe8f5', mid:'#eef1f6', bottom:'#f4f0e8', dtop:'#1b2130', dmid:'#0f121a', dbottom:'#08090c' },
    clearsky: { label:'Clear Sky', swatch:'#4fa3dd', top:'#2f8ddb', mid:'#7ec3ef', bottom:'#e3f3fb', dtop:'#0c2338', dmid:'#123a5c', dbottom:'#1e527c' },
    cloudy:   { label:'Cloudy',    swatch:'#b9c7d2', top:'#8fa9bd', mid:'#c7d3dc', bottom:'#e7ebee', dtop:'#232c36', dmid:'#333d47', dbottom:'#4a535c', clouds:true },
    overcast: { label:'Overcast',  swatch:'#d2d7de', top:'#c7cdd6', mid:'#d7dbe2', bottom:'#e4e6ea', dtop:'#22242a', dmid:'#2a2d33', dbottom:'#33363d' },
    sunset:   { label:'Sunset',    swatch:'#f4667a', top:'#ffb27a', mid:'#f4667a', bottom:'#3d2a52', dtop:'#3a2440', dmid:'#26173a', dbottom:'#120c22' },
    night:    { label:'Night',     swatch:'#0b0f1c', top:'#131a2b', mid:'#0b0f1c', bottom:'#05070f', dtop:'#10141f', dmid:'#0a0d16', dbottom:'#04050a' }
  };
  var BG_ORDER = ['studio','clearsky','cloudy','overcast','sunset','night'];

  function buildSkyTexture(presetKey, isDark){
    var preset = BG_PRESETS[presetKey] || BG_PRESETS.studio;
    var w = preset.clouds ? 128 : 8;
    var h = 256;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0, isDark ? preset.dtop : preset.top);
    g.addColorStop(0.55, isDark ? preset.dmid : preset.mid);
    g.addColorStop(1, isDark ? preset.dbottom : preset.bottom);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    if(preset.clouds){
      var cloudColor = isDark ? 'rgba(214,219,226,0.45)' : 'rgba(255,255,255,0.85)';
      try{ ctx.filter = 'blur(4px)'; }catch(err){}
      for(var i=0;i<9;i++){
        var cx = Math.random()*w;
        var cy = h*0.12 + Math.random()*h*0.35;
        var rx = w*(0.14+Math.random()*0.18);
        var ry = rx*(0.35+Math.random()*0.25);
        ctx.fillStyle = cloudColor;
        ctx.beginPath();
        ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
        ctx.fill();
      }
      ctx.filter = 'none';
    }

    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // bgMode is 'preset' (one of the procedural sky gradients), 'solid' (a
  // single flat backdrop color), or 'image' (an uploaded equirectangular
  // panorama). Only one is "live" (scene.background) at a time, but the
  // other two keep their last-used value in sceneState so switching back
  // to them doesn't lose what the user picked.
  var sceneState = {
    groundColor: '#ffffff', groundTexture: 'checker',
    bgMode: 'preset', bgPreset: 'studio',
    bgSolidColor: '#1b2130',
    bgImageDataUrl: null, bgImageName: null,
    shadowSoftness: 1,
    bloomEnabled: false, bloomStrength: 0.8, bloomRadius: 0.4, bloomThreshold: 0.85
  };

  // Shadow softness is a single global knob (rather than per-light) since
  // most sandbox scenes only have one or two lights and a per-light control
  // would mostly just be one more thing to keep in sync. Applies to every
  // shadow-casting light's THREE.Light.shadow.radius, which blurs the PCF
  // soft-shadow sampling -- higher reads as a bigger, softer light source.
  function applyShadowSoftness(v){
    if(typeof v !== 'number' || isNaN(v)) v = 1;
    sceneState.shadowSoftness = v;
    lights.forEach(function(l){
      var lo = l.userData.lightObj;
      if(lo && lo.shadow) lo.shadow.radius = v;
    });
  }

  function applyBloomSettings(){
    bloomPass.enabled = !!sceneState.bloomEnabled;
    bloomPass.strength = sceneState.bloomStrength;
    bloomPass.radius = sceneState.bloomRadius;
    bloomPass.threshold = sceneState.bloomThreshold;
  }
  applyBloomSettings();
  // Which Backdrop tab the Scene panel currently shows -- kept separate
  // from sceneState.bgMode so clicking the "Image" tab before choosing a
  // file doesn't itself change the live background.
  var bgActiveTab = 'preset';
  var bgImageLoader = new THREE.TextureLoader();

  function disposeCurrentBackground(){
    if(scene.background && scene.background.dispose) scene.background.dispose();
  }
  function setBackgroundPreset(key){
    if(!BG_PRESETS[key]) key = 'studio';
    disposeCurrentBackground();
    scene.background = buildSkyTexture(key, dark);
    sceneState.bgMode = 'preset';
    sceneState.bgPreset = key;
    bgActiveTab = 'preset';
  }
  function setBackgroundSolid(hex){
    hex = hex || '#1b2130';
    disposeCurrentBackground();
    scene.background = new THREE.Color(hex);
    sceneState.bgMode = 'solid';
    sceneState.bgSolidColor = hex;
    bgActiveTab = 'solid';
  }
  // dataUrl is the source of truth (what gets saved/undone); the texture
  // itself is rebuilt from it here so restoring a snapshot never depends
  // on holding onto a specific, possibly-disposed Texture instance.
  function setBackgroundImageFromDataUrl(dataUrl, name, onDone){
    bgImageLoader.load(dataUrl, function(tex){
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.encoding = THREE.sRGBEncoding;
      disposeCurrentBackground();
      scene.background = tex;
      sceneState.bgMode = 'image';
      sceneState.bgImageDataUrl = dataUrl;
      sceneState.bgImageName = name || null;
      bgActiveTab = 'image';
      if(onDone) onDone();
    }, undefined, function(err){
      console.error(err);
      showToast('Could not load that image as a skybox.');
    });
  }
  function restoreBackground(bg){
    if(!bg){ setBackgroundPreset('studio'); return; }
    if(bg.mode === 'solid') setBackgroundSolid(bg.solidColor);
    else if(bg.mode === 'image' && bg.imageDataUrl) setBackgroundImageFromDataUrl(bg.imageDataUrl, bg.imageName);
    else setBackgroundPreset(bg.preset || 'studio');
  }
  function setGroundColor(hex){
    if(!hex) hex = '#ffffff';
    ground.material.color.set(hex);

  // A glowing object is also a real light source: turning Glow on gives
  // the object's root a small THREE.PointLight (parented to it, so it
  // always tracks the object's position for free) that actually lights
  // up whatever's nearby — including softening the object's own shadow,

  // cast for it. It never casts its own shadow, to keep the extra cost

  var GLOW_LIGHT_SCALE = 2.2;
  var GLOW_LIGHT_DISTANCE = 9;
  var GLOW_LIGHT_DECAY = 2;

  function ensureGlowLight(root){
    if(root.userData.glowLight) return root.userData.glowLight;

    light.castShadow = false;

    root.userData.glowLight = light;
    return light;
  }
  function removeGlowLight(root){
    if(!root.userData.glowLight) return;
    root.remove(root.userData.glowLight);
    root.userData.glowLight = null;
  }
  function syncGlowLightIntensity(root){
    if(!root.userData.glowLight) return;
    var mat = firstMaterial(root);
    var v = mat && mat.emissiveIntensity ? mat.emissiveIntensity : 0;
    root.userData.glowLight.intensity = v * GLOW_LIGHT_SCALE;

  function applyRoughness(root, v){

  function applyMetalness(root, v){

  }
  // Three.js shadow maps render every caster as a solid silhouette and
  // have no per-object "shadow darkness" knob. The seemingly-obvious fix —
  // give the object's shadow pass its own customDepthMaterial with a
  // dithered alphaMap, alpha-tested against opacity — doesn't actually
  // work in this version: WebGLShadowMap unconditionally overwrites a
  // custom depth material's alphaMap/alphaTest with the REAL material's
  // every single frame (see getDepthMaterial() in three's shadow-map
  // source), so anything set on the custom material gets clobbered before
  // it ever renders. And setting alphaMap/alphaTest on the real material
  // instead isn't an option either — alphaTest also runs in the main
  // color pass, so it would punch actual holes in the object itself
  // rather than keeping it smoothly translucent.
  //
  // So instead: a partially-transparent object skips the real shadow map
  // (as before) and gets a soft round "contact shadow" decal on the
  // ground — one per active light, not just one centered under the
  // object, so it actually falls in the direction that light casts a
  // shadow rather than looking like the light is straight overhead. Each
  // decal's ground position is a proper light→object→ground projection
  // (the same geometry a real point-light shadow uses), and its opacity
  // is a share of the object's own opacity split across however many
  // lights are active, so N overlapping decals don't add up darker than
  // one real shadow would. Genuinely continuous, correctly nothing at
  // opacity 0, and it hands off to the real, sharper shadow once opacity
  // reaches 1. The one honest limitation: like any decal, it only shows
  // up on the ground, not on other objects the way a real shadow would.
  var BLOB_SHADOW_MAX_OPACITY = 0.55;
  var blobShadowTex = null;
  function getBlobShadowTexture(){
    if(blobShadowTex) return blobShadowTex;
    var size = 128;
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    var grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(0.7, 'rgba(0,0,0,0.55)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    blobShadowTex = new THREE.CanvasTexture(canvas);
    return blobShadowTex;
  }
  function createBlobShadowMesh(){
    var mat = new THREE.MeshBasicMaterial({
      map: getBlobShadowTexture(),
      color: 0x000000,
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    var blob = new THREE.Mesh(new THREE.CircleGeometry(1, 32), mat);
    blob.rotation.x = -Math.PI / 2;
    blob.renderOrder = 1;
    scene.add(blob);
    return blob;
  }
  function disposeBlobShadowMesh(mesh){
    scene.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.dispose();
  }
  function removeAllBlobShadows(root){
    if(!root.userData.blobShadows) return;
    root.userData.blobShadows.forEach(function(entry){ disposeBlobShadowMesh(entry.mesh); });
    root.userData.blobShadows = null;
  }
  var blobBox = new THREE.Box3();
  var blobSize = new THREE.Vector3();
  var blobLightPos = new THREE.Vector3();
  var blobObjPos = new THREE.Vector3();
  // Projects where a light-to-object ray continues on to hit the ground
  // (y = 0) — the same geometry that puts a real shadow on the far side
  // of an object from its light, not directly underneath it.
  function projectGroundShadowPoint(lightPos, objPos, out){
    var denom = lightPos.y - objPos.y;
    var t = Math.abs(denom) < 1e-4 ? 1 : (lightPos.y / denom);
    if(t < 1) t = 1;
    if(t > 40) t = 40;
    out.x = lightPos.x + t * (objPos.x - lightPos.x);
    out.z = lightPos.z + t * (objPos.z - lightPos.z);
    out.y = 0.015;
  }
  function updateBlobShadowsForObject(root, v){
    var partial = v > 0.001 && v < 0.999;
    if(!partial){
      removeAllBlobShadows(root);
      return;
    }
    if(!root.userData.blobShadows) root.userData.blobShadows = [];
    var entries = root.userData.blobShadows;

    // Drop decals for lights that no longer exist, add decals for any
    // light that doesn't have one yet — keeps this in sync every frame
    // even as lights get added/removed while the object stays translucent.
    for(var i = entries.length - 1; i >= 0; i--){
      if(lights.indexOf(entries[i].light) === -1){
        disposeBlobShadowMesh(entries[i].mesh);
        entries.splice(i, 1);
      }
    }
    lights.forEach(function(l){
      var has = entries.some(function(e){ return e.light === l; });
      if(!has) entries.push({ light: l, mesh: createBlobShadowMesh() });
    });

    if(!entries.length) return;

    blobBox.setFromObject(root);
    blobBox.getSize(blobSize);
    var radius = Math.max(blobSize.x, blobSize.z, 0.3) * 0.65;
    root.getWorldPosition(blobObjPos);
    var perLightOpacity = (v * BLOB_SHADOW_MAX_OPACITY) / entries.length;

    entries.forEach(function(entry){
      entry.light.getWorldPosition(blobLightPos);
      projectGroundShadowPoint(blobLightPos, blobObjPos, entry.mesh.position);
      entry.mesh.scale.set(radius, radius, 1);
      entry.mesh.material.opacity = perLightOpacity;
    });

  // ---------------------------------------------------------------
  // Per-object reflection probes: a metal/mirror object needs to see
  // everything around it EXCEPT itself, and should still show up in a
  // neighboring mirror's reflection. The single shared cubemap above
  // can't do that (it's one texture used by every material), so any
  // object reflective enough to notice gets its own small cubemap,
  // captured from its own position with only itself hidden. Non-metal
  // materials (matte, and low-Fresnel "Clear" glass) keep using the
  // cheap shared cubemap instead — they don't show a visible
  // self-reflection artifact, so a dedicated probe would be wasted cost.
  // ---------------------------------------------------------------
  var OWN_PROBE_SIZE = 128;
  function createOwnProbe(){
    var target = new THREE.WebGLCubeRenderTarget(OWN_PROBE_SIZE, {
      format: THREE.RGBAFormat,
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter
    });

    scene.add(probeCam);
    return { cubeCamera: probeCam, target: target };
  }
  function disposeOwnProbe(root){
    if(root.userData.ownProbe){
      scene.remove(root.userData.ownProbe.cubeCamera);
      root.userData.ownProbe.target.dispose();
      delete root.userData.ownProbe;
    }

    var m = firstMaterial(root);

      if(!root.userData.ownProbe) root.userData.ownProbe = createOwnProbe();
      eachMaterial(root, function(mat){ mat.envMap = root.userData.ownProbe.target.texture; mat.needsUpdate = true; });

      eachMaterial(root, function(mat){ mat.envMap = envMap; mat.needsUpdate = true; });

  // ---------------------------------------------------------------
  // Object spawning
  // ---------------------------------------------------------------
  var objects = [];
  var spawnColors = ['#8fa3c7','#d99a5b','#7fb89a','#c07f9e','#9c8fd9','#c9b25b'];
  var spawnIndex = 0;
  var placedCount = 0;

  // three.js r0.137 has no CapsuleGeometry (added in a later release), so a
  // capsule is built by hand: a profile line traced from the bottom pole,
  // up around the bottom hemisphere, straight up the side, and around the
  // top hemisphere to the top pole, then revolved into a solid with
  // LatheGeometry. radius is the capsule's width; cylinderHeight is the
  // length of the straight middle section (excluding the two domed caps).
  function makeCapsuleGeometry(radius, cylinderHeight, capSegments, radialSegments){
    var halfH = cylinderHeight / 2;
    var points = [];
    var i, theta, x, y;
    for(i = 0; i <= capSegments; i++){
      theta = -Math.PI / 2 + (Math.PI / 2) * (i / capSegments);
      x = radius * Math.cos(theta);
      y = -halfH + radius * Math.sin(theta);
      points.push(new THREE.Vector2(x, y));
    }
    for(i = 0; i <= capSegments; i++){
      theta = (Math.PI / 2) * (i / capSegments);
      x = radius * Math.cos(theta);
      y = halfH + radius * Math.sin(theta);
      points.push(new THREE.Vector2(x, y));
    }
    return new THREE.LatheGeometry(points, radialSegments);
  }

  var SHAPE_DEFS = {
    box:      { make: function(){ return new THREE.BoxGeometry(1,1,1); },              halfHeight: 0.5,  label: 'Box' },
    sphere:   { make: function(){ return new THREE.SphereGeometry(0.6, 32, 24); },      halfHeight: 0.6,  label: 'Sphere' },
    cylinder: { make: function(){ return new THREE.CylinderGeometry(0.5, 0.5, 1.1, 28); }, halfHeight: 0.55, label: 'Cylinder' },
    cone:     { make: function(){ return new THREE.ConeGeometry(0.6, 1.2, 28); },       halfHeight: 0.6,  label: 'Cone' },
    torus:    { make: function(){ var g = new THREE.TorusGeometry(0.5, 0.18, 16, 48); g.rotateX(Math.PI / 2); return g; }, halfHeight: 0.18, label: 'Torus' },
    capsule:  { make: function(){ return makeCapsuleGeometry(0.35, 0.5, 10, 24); },     halfHeight: 0.6,  label: 'Capsule' }
  };

  function nextSpawnColor(){
    var c = spawnColors[spawnIndex % spawnColors.length];
    spawnIndex++;
    return c;
  }

  function spawnPosition(){
    var angle = placedCount * 0.9;
    var radius = 1.1 + (placedCount % 4) * 0.55;
    return new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
  }

  function createPrimitive(type){
    var def = SHAPE_DEFS[type];

    // MeshPhysicalMaterial is a superset of MeshStandardMaterial — same
    // color/roughness/metalness/envMap/opacity behavior, plus clearcoat
    // for the "Clearcoat" knob. clearcoatRoughness is fixed at creation
    // (a glossy top coat reads as car paint); only the coat amount itself
    // is a user-facing slider, to keep the inspector from getting too busy.
    var mat = new THREE.MeshPhysicalMaterial({ envMap: envMap, clearcoatRoughness: 0.12 });
    var mesh = new THREE.Mesh(def.make(), mat);
    mesh.userData.shapeType = type;
    return { mesh: mesh, halfHeight: def.halfHeight, label: def.label };
  }

  function finalizeShape(mesh, halfHeight, label, presetKey, colorHex){
    pushHistory();
    var pos = spawnPosition();
    mesh.position.set(pos.x, halfHeight, pos.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.selectable = true;
    mesh.userData.kind = 'shape';
    mesh.userData.label = label;
    applyPreset(mesh, presetKey || 'matte');
    applyColor(mesh, colorHex || nextSpawnColor());
    scene.add(mesh);
    objects.push(mesh);
    placedCount++;
    select(mesh);
    updateHud();
  }

  function addShape(type){
    var built = createPrimitive(type);
    if(!built) return;
    finalizeShape(built.mesh, built.halfHeight, built.label);
  }

  document.getElementById('addBox').addEventListener('click', function(){ addShape('box'); });

  document.getElementById('addCone').addEventListener('click', function(){ addShape('cone'); });
  document.getElementById('addTorus').addEventListener('click', function(){ addShape('torus'); });

  // ---------------------------------------------------------------
  // Import (.glb / .gltf)
  // ---------------------------------------------------------------
  var fileInput = document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var lower = file.name.toLowerCase();
    if(!lower.endsWith('.glb') && !lower.endsWith('.gltf')){
      showToast('Please choose a .glb or .gltf file.');
      fileInput.value = '';
      return;
    }
    var url = URL.createObjectURL(file);
    var loader = new THREE.GLTFLoader();
    showToast('Loading ' + file.name + '…');
    loader.load(url, function(gltf){
      var root = gltf.scene || gltf.scenes[0];
      var box = new THREE.Box3().setFromObject(root);
      var size = new THREE.Vector3(); box.getSize(size);
      var maxDim = Math.max(size.x, size.y, size.z) || 1;
      var scale = 1.5 / maxDim;
      root.scale.setScalar(scale);
